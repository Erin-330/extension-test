<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>RORR · 랭킹</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" crossorigin />
  <link rel="stylesheet" href="./src/tokens.css" />
  <style>
    html, body { width: 100%; min-height: 100vh; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--color-background-light);
      font-family: var(--font-family-base);
    }

    .rank-app {
      flex: 1;
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .top-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-text-30-sub-text-dark);
      line-height: 1.2;
    }
    .icon-btn {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--color-text-50);
      cursor: pointer;
      text-decoration: none;
      transition: background 120ms, border-color 120ms;
    }
    .icon-btn:hover {
      background: var(--color-surface2-alt);
      border-color: var(--color-primary);
    }

    .month-select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-30-sub-text-dark);
      font-family: var(--font-family-base);
      font-size: 14px;
      font-weight: 500;
      outline: none;
    }

    .top5-section {
      background: var(--color-surface);
      border-radius: 16px;
      box-shadow: var(--shadow-light-surface);
      padding: 16px;
    }
    .section-label {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-text-50);
      margin-bottom: 12px;
    }
    .bar-graph {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      align-items: end;
      height: 200px;
    }
    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      height: 100%;
      justify-content: flex-end;
    }
    .bar-fill {
      width: 100%;
      background: var(--gradient-boosterwall);
      border-radius: 8px 8px 0 0;
      min-height: 4px;
      position: relative;
    }
    .bar-fill .bar-streak {
      position: absolute;
      top: -18px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text-30-sub-text-dark);
      font-variant-numeric: tabular-nums;
    }
    .bar-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text-30-sub-text-dark);
      line-height: 1.2;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    .my-rank {
      background: var(--color-surface);
      border-radius: 16px;
      box-shadow: var(--shadow-light-surface);
      padding: 14px 16px;
      border: 2px solid var(--color-selected);
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      align-items: center;
      gap: 12px;
    }
    .my-rank-meta {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      color: var(--color-text-50);
      font-size: 12px;
      padding-top: 6px;
      border-top: 1px dashed var(--color-border);
    }
    .my-rank-meta b {
      color: var(--color-text-30-sub-text-dark);
      font-variant-numeric: tabular-nums;
    }

    .rank-row {
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--color-surface);
      box-shadow: var(--shadow-light-surface);
      cursor: pointer;
      transition: background 120ms;
    }
    .rank-row:hover { background: var(--color-surface2-alt); }
    .rank-row.me { border: 2px solid var(--color-selected); }

    .rank-num {
      font-size: 14px;
      font-weight: 700;
      color: var(--color-text-30-sub-text-dark);
      width: 28px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--gradient-boosterwall);
      color: var(--color-text-100);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }
    .nick-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .nick {
      font-size: 14px;
      font-weight: 700;
      color: var(--color-text-30-sub-text-dark);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .grade-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-text-100);
      width: fit-content;
    }
    .g-top5 { background: var(--gradient-grade-top-5); }
    .g-diamond { background: var(--gradient-grade-diamond); color: var(--color-text-30-sub-text-dark); }
    .g-platinum { background: var(--gradient-grade-platinum); color: var(--color-text-30-sub-text-dark); }
    .g-gold { background: var(--gradient-grade-gold); }
    .g-silver { background: var(--gradient-grade-silver); }
    .g-bronze { background: var(--gradient-grade-bronze); }
    .g-participant { background: var(--gradient-grade-participant); }

    .streak-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .streak-current {
      font-size: 14px;
      font-weight: 700;
      color: var(--color-primary);
      font-variant-numeric: tabular-nums;
    }
    .streak-sub {
      font-size: 11px;
      font-weight: 400;
      color: var(--color-text-50);
      font-variant-numeric: tabular-nums;
    }

    .grade-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .grade-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 0;
    }
    .grade-header .name {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-30-sub-text-dark);
    }
    .grade-header .reward {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-boost-energy-4-icon);
      font-variant-numeric: tabular-nums;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--color-background-b-30);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      background: var(--color-surface);
      width: 100%;
      max-width: 560px;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: slideup 200ms ease both;
    }
    @keyframes slideup {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--gradient-boosterwall);
      color: var(--color-text-100);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 24px;
    }
    .modal-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text-30-sub-text-dark);
    }
    .modal-stats {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .modal-stat {
      background: var(--color-surface2-alt);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .modal-stat .v {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-30-sub-text-dark);
      font-variant-numeric: tabular-nums;
    }
    .modal-stat .l {
      font-size: 11px;
      font-weight: 400;
      color: var(--color-text-50);
      margin-top: 2px;
    }
    .modal-close {
      margin-top: 12px;
      padding: 10px 22px;
      border-radius: 10px;
      border: 1px solid var(--color-primary);
      background: var(--color-primary);
      color: var(--color-text-100);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .modal-close:hover { background: var(--color-primary-dark); }

    .info-text {
      font-size: 14px;
      font-weight: 400;
      color: var(--color-text-30-sub-text-dark);
      line-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="rank-app">
    <div class="topbar">
      <a class="icon-btn" href="./profile.html" aria-label="닫기">✕</a>
      <div class="top-title">랭킹</div>
      <button class="icon-btn" id="infoBtn" aria-label="랭킹 기준 안내">ⓘ</button>
    </div>

    <select class="month-select" id="monthSelect">
      <option value="2026-05">2026년 5월</option>
      <option value="2026-04">2026년 4월</option>
      <option value="2026-03">2026년 3월</option>
    </select>

    <section class="top5-section">
      <div class="section-label">Top 5</div>
      <div class="bar-graph" id="barGraph"></div>
    </section>

    <section>
      <div class="section-label">내 랭킹</div>
      <div id="myRank"></div>
    </section>

    <div id="gradeSections"></div>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal-sheet">
      <div class="modal-avatar" id="mAvatar">?</div>
      <div class="modal-name" id="mName">유저</div>
      <div class="grade-badge" id="mGrade">Gold</div>
      <div class="modal-stats">
        <div class="modal-stat"><div class="v" id="mCurrent">0</div><div class="l">현재 스트릭</div></div>
        <div class="modal-stat"><div class="v" id="mLong">0</div><div class="l">최장 스트릭</div></div>
        <div class="modal-stat"><div class="v" id="mReward">0</div><div class="l">예상 보상</div></div>
      </div>
      <button class="modal-close" id="modalClose">닫기</button>
    </div>
  </div>

  <div class="modal-backdrop" id="infoModal">
    <div class="modal-sheet">
      <div class="modal-name">랭킹 기준 안내</div>
      <p class="info-text">월간 스트릭 수가 동점일 경우, 최장 연승 수 → 누적 부스트 수 순으로 순위를 결정합니다.</p>
      <button class="modal-close" id="infoClose">닫기</button>
    </div>
  </div>

  <script type="module" src="./src/rank.js"></script>
</body>
</html>
