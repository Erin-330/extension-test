<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>RORR · 랭킹</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" crossorigin />
  <link rel="stylesheet" href="./src/tokens.css" />
  <style>
    html, body {
      width: 100%;
      min-height: 100vh;
    }

    body {
      display: flex;
      flex-direction: column;
      position: relative;
      font-family: var(--font-family-base);
      background: var(--color-background-light);
      color: var(--color-text-30-sub-text-dark);
    }

    .theme-toggle {
      position: absolute;
      top: 14px;
      right: 56px;
      background: none;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--color-text-50);
      transition: border-color 120ms, background 120ms;
      z-index: 10;
    }
    .theme-toggle:hover { background: var(--color-surface2-alt); border-color: var(--color-primary); }

    .rank-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 20px 24px;
      gap: 16px;
    }

    .rank-header {
      display: grid;
      grid-template-columns: 34px 1fr 34px;
      align-items: center;
      padding: 16px 0 4px;
      gap: 12px;
    }
    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: none;
      border: 1px solid var(--color-border);
      color: var(--color-text-50);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 120ms, border-color 120ms;
    }
    .icon-btn:hover { background: var(--color-surface2-alt); border-color: var(--color-primary); }
    .rank-title {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--color-text-30-sub-text-dark);
    }

    .month-select-wrap {
      display: flex;
      justify-content: flex-start;
    }
    .month-select {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-30-sub-text-dark);
      font-family: var(--font-family-base);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      transition: border-color 120ms;
    }
    .month-select:focus { border-color: var(--color-primary); }

    .top5-card {
      background: var(--color-surface);
      border-radius: 16px;
      box-shadow: var(--shadow-light-surface);
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .top5-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-text-50);
    }
    #rivCanvas { width: 100%; height: 280px; display: block; }

    .rank-row {
      display: grid;
      grid-template-columns: 28px 44px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--color-surface);
      border-radius: 14px;
      box-shadow: var(--shadow-light-surface-2);
      cursor: pointer;
      transition: border-color 120ms, transform 120ms;
      border: 1px solid transparent;
    }
    .rank-row:hover { border-color: var(--color-border); }
    .rank-row.me {
      border-color: var(--color-primary);
      background: color-mix(in srgb, var(--color-primary) 6%, var(--color-surface));
    }
    .rank-rank {
      font-size: 14px;
      font-weight: 700;
      color: var(--color-text-50);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    .rank-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--gradient-boosterwall);
      color: var(--color-text-100);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
    }
    .rank-body {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .rank-nick {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--color-text-30-sub-text-dark);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .grade-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      color: var(--color-text-100);
      width: fit-content;
    }
    .grade-badge.diamond { background: var(--gradient-grade-diamond); color: var(--color-text-30-sub-text-dark); }
    .grade-badge.gold    { background: var(--gradient-grade-gold); }
    .grade-badge.silver  { background: var(--gradient-grade-silver); }
    .grade-badge.bronze  { background: var(--gradient-grade-bronze); }
    .grade-badge.top5    { background: var(--gradient-grade-top-5); }

    .rank-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      font-variant-numeric: tabular-nums;
    }
    .rank-streak {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-30-sub-text-dark);
      line-height: 1.2;
    }
    .rank-sub {
      font-size: 11px;
      font-weight: 400;
      color: var(--color-text-50);
      line-height: 1.2;
    }
    .rank-energy {
      font-size: 11px;
      font-weight: 700;
      color: var(--color-boost-energy-4-icon);
      line-height: 1.2;
    }

    .my-rank-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .section-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-text-50);
      padding: 0 2px;
    }

    .grade-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .grade-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px 2px;
    }
    .grade-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--color-text-30-sub-text-dark);
    }
    .grade-medal {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      box-shadow: inset 0 -2px 4px rgba(0,0,0,0.2), 0 2px 6px rgba(0,0,0,0.12);
    }
    .grade-medal.diamond { background: var(--gradient-grade-diamond); }
    .grade-medal.gold    { background: var(--gradient-grade-gold); }
    .grade-medal.silver  { background: var(--gradient-grade-silver); }
    .grade-medal.bronze  { background: var(--gradient-grade-bronze); }
    .grade-reward {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-boost-energy-4-icon);
      font-variant-numeric: tabular-nums;
    }

    /* Modal */
    .scrim {
      position: fixed;
      inset: 0;
      background: var(--color-background-b-30);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .scrim.open { display: flex; }
    .sheet {
      width: 100%;
      max-width: 560px;
      background: var(--color-surface);
      border-radius: 20px 20px 0 0;
      padding: 24px 22px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: slideUp 260ms ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--gradient-boosterwall);
      color: var(--color-text-100);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
    }
    .sheet-nick {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-text-30-sub-text-dark);
    }
    .sheet-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      margin-top: 8px;
    }
    .sheet-stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
      padding: 12px 8px;
      background: var(--color-surface2-alt);
      border-radius: 12px;
    }
    .sheet-stat-label {
      font-size: 11px;
      font-weight: 400;
      color: var(--color-text-50);
      text-align: center;
    }
    .sheet-stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text-30-sub-text-dark);
      font-variant-numeric: tabular-nums;
    }
    .sheet-close {
      margin-top: 6px;
      padding: 10px 22px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: transparent;
      color: var(--color-text-30-sub-text-dark);
      font-family: var(--font-family-base);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .sheet-close:hover { background: var(--color-surface2-alt); }

    .info-modal-body {
      align-self: stretch;
      text-align: left;
      color: var(--color-text-30-sub-text-dark);
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
    }
    .info-modal-body strong { color: var(--color-primary); font-weight: 700; }
    .info-modal-body ul { padding-left: 18px; margin: 8px 0 0; }
    .info-modal-body li { margin-bottom: 4px; }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">
    <span id="themeIcon">☀️</span>
  </button>

  <main class="rank-main">
    <header class="rank-header">
      <a class="icon-btn" href="./profile.html" aria-label="닫기">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </a>
      <div class="rank-title">랭킹</div>
      <button class="icon-btn" id="infoBtn" aria-label="랭킹 기준 안내">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      </button>
    </header>

    <div class="month-select-wrap">
      <select class="month-select" id="monthSelect" aria-label="월 선택">
        <option value="2026-05">2026년 5월</option>
        <option value="2026-04">2026년 4월</option>
        <option value="2026-03">2026년 3월</option>
        <option value="2026-02">2026년 2월</option>
        <option value="2026-01">2026년 1월</option>
      </select>
    </div>

    <section class="top5-card">
      <div class="top5-title">TOP 5 · 월간 스트릭</div>
      <canvas id="rivCanvas" style="width:100%;height:280px;display:block;"></canvas>
    </section>

    <section class="my-rank-section">
      <div class="section-label">내 랭킹</div>
      <div id="myRankRow"></div>
    </section>

    <section id="gradeSections"></section>
  </main>

  <div class="scrim" id="userScrim" role="dialog" aria-modal="true">
    <div class="sheet" id="userSheet"></div>
  </div>

  <div class="scrim" id="infoScrim" role="dialog" aria-modal="true">
    <div class="sheet">
      <div class="sheet-nick">랭킹 기준 안내</div>
      <div class="info-modal-body">
        랭킹은 <strong>이번 달 스트릭</strong> 기준으로 매겨집니다.
        <ul>
          <li>1차: 현재 진행 중인 연속 스트릭 수가 많은 순</li>
          <li>2차: 동점 시 최장 연승 수가 많은 순</li>
          <li>3차: 그래도 동점이면 가입일이 빠른 순</li>
        </ul>
      </div>
      <button class="sheet-close" id="infoClose">닫기</button>
    </div>
  </div>

  <script type="module" src="./src/rank.js"></script>
</body>
</html>
