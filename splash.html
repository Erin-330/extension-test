<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>RORR</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" crossorigin />
  <link rel="stylesheet" href="./src/tokens.css" />
  <style>
    html, body {
      width: 100%;
      min-height: 100vh;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-background-light);
      overflow: hidden;
    }

    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 24px;
      animation: fade-in 320ms ease both;
    }

    .splash-emblem {
      width: 96px;
      height: 96px;
      object-fit: contain;
      margin-bottom: 18px;
      filter: drop-shadow(var(--shadow-light-surface));
    }

    .splash-title {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      background: var(--gradient-boosterwall);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .splash-tagline {
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: var(--color-text-50);
      margin-bottom: 40px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-primary);
    }

    footer {
      position: absolute;
      bottom: 14px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.2;
      color: var(--color-text-50);
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }

    @media (prefers-reduced-motion: no-preference) {
      .spinner {
        animation: spin 700ms linear infinite;
      }
      .splash-emblem {
        animation: fade-in 320ms ease both, pulse 1.8s ease-in-out 320ms infinite;
      }
    }
  </style>
</head>
<body>
  <main class="splash" role="status" aria-live="polite" aria-label="RORR 로딩 중">
    <img
      src="https://erin-bucket-team.s3.amazonaws.com/RORR%20EMBLEM.png"
      alt="RORR 엠블럼"
      class="splash-emblem"
    />
    <h1 class="splash-title">RORR</h1>
    <p class="splash-tagline">스포츠를 더 즐겁게, 함께</p>
    <div class="spinner" aria-hidden="true"></div>
  </main>

  <footer>ⓒPitch Interactive Co.,LTD. All rights reserved</footer>

  <script type="module" src="./src/splash.js"></script>
</body>
</html>
