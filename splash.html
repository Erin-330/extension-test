<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RORR · Splash</title>
  <link rel="stylesheet" href="src/tokens.css" />
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
      background-color: #8000FF;
      transition: background-color 1000ms ease-out;
    }
    body.fading { background-color: #000000; }

    .splash {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      color: var(--color-text-100);
    }
    .splash .emblem {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      display: grid;
      place-items: center;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
      animation: pulseEmblem 2.4s ease-in-out infinite;
    }
    .splash .emblem img {
      width: 88px;
      height: 88px;
      object-fit: contain;
    }
    .splash .brand {
      font-weight: 700;
      font-size: 40px;
      letter-spacing: 0.12em;
      color: var(--color-text-100);
    }
    .splash .tagline {
      font-weight: 400;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }
    .splash .loader {
      margin-top: 16px;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--color-text-100);
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulseEmblem {
      0%, 100% { transform: scale(1); box-shadow: 0 12px 36px rgba(0,0,0,0.25); }
      50%      { transform: scale(1.04); box-shadow: 0 16px 48px rgba(0,0,0,0.32); }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash .emblem, .splash .loader { animation: none; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="emblem">
      <img src="https://erin-bucket-team.s3.amazonaws.com/RORR%20EMBLEM.png" alt="RORR" />
    </div>
    <div class="brand">RORR</div>
    <div class="tagline">스포츠를 더 즐겁게, 함께</div>
    <div class="loader" aria-label="로딩 중"></div>
  </div>
  <script>
    // Auto-advance to login after 2.2 seconds (fade for the last 1s)
    setTimeout(() => { document.body.classList.add('fading'); }, 1200);
    setTimeout(() => { window.location.replace('login.html'); }, 2200);
  </script>
</body>
</html>
