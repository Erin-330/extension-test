<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RORR — 구매 내역</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
  <link rel="stylesheet" href="./src/tokens.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-family-base);
      background-color: var(--color-background-light);
      color: var(--color-text-0);
      transition: background-color 200ms ease, color 200ms ease;
    }

    [data-theme="dark"] {
      color: var(--color-text-100);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      align-items: center;
      padding: 14px 16px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }
    [data-theme="dark"] header {
      background: var(--color-surface-dark);
      border-bottom-color: var(--color-border-dark);
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-30-sub-text-dark);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: border-color 120ms;
    }
    [data-theme="dark"] .back-btn {
      background: var(--color-surface-dark);
      border-color: var(--color-border-dark);
      color: var(--color-text-90);
    }
    .back-btn:hover { border-color: var(--color-primary); }
    .back-btn svg { width: 18px; height: 18px; }

    .page-title {
      text-align: center;
      font-size: var(--font-size-description-2);
      font-weight: var(--font-weight-bold);
      line-height: 1.2;
    }

    /* Main */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 24px;
      gap: 4px;
    }

    /* Initial loading */
    .initial-loading {
      flex: 1;
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .initial-loading canvas {
      width: 250px;
      height: 250px;
      display: block;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .empty-state p {
      font-size: var(--font-size-chat);
      font-weight: var(--font-weight-regular);
      color: var(--color-text-50);
    }

    /* Card list */
    #list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Purchase card */
    .purchase-card {
      background: var(--color-surface);
      border-radius: 14px;
      box-shadow: var(--shadow-light-surface);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    [data-theme="dark"] .purchase-card {
      background: var(--color-surface-alt-dark);
      box-shadow: var(--shadow-dark-surface);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .energy-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--gradient-boost-energy-4-bg);
      color: var(--color-text-100);
      font-size: var(--font-size-annotation);
      font-weight: var(--font-weight-bold);
      flex-shrink: 0;
    }
    .energy-badge svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    .tx-code {
      font-size: var(--font-size-annotation);
      font-weight: var(--font-weight-regular);
      color: var(--color-text-50);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      text-align: right;
    }

    .payment-date {
      font-size: var(--font-size-annotation);
      font-weight: var(--font-weight-regular);
      color: var(--color-text-30-sub-text-dark);
      font-variant-numeric: tabular-nums;
    }
    [data-theme="dark"] .payment-date {
      color: var(--color-text-80-sub-text-light);
    }

    .expire-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .expire-row svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      color: var(--color-text-50);
    }
    .expire-label {
      font-size: var(--font-size-annotation);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-50);
    }
    .expire-label.expired {
      color: var(--color-error);
    }
    .expire-label.today {
      color: var(--color-accent);
    }

    /* Sentinel + bottom loader */
    .sentinel { width: 100%; height: 1px; }

    .bottom-loader {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 8px 0 16px;
    }
    .bottom-loader.active { display: flex; }
    .bottom-loader canvas {
      width: 80px;
      height: 80px;
      display: block;
    }

    .end-note {
      display: none;
      text-align: center;
      font-size: var(--font-size-annotation);
      font-weight: var(--font-weight-regular);
      color: var(--color-text-50);
      padding: 8px 0 16px;
      letter-spacing: 0.06em;
    }
    .end-note.active { display: block; }

    /* Error modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--color-background-b-30);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--color-surface);
      border-radius: 16px;
      padding: 24px 20px 20px;
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--floating-effect);
    }
    [data-theme="dark"] .modal-box {
      background: var(--color-surface-alt-dark);
    }
    .modal-title {
      font-size: var(--font-size-description-2);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-0);
      text-align: center;
    }
    [data-theme="dark"] .modal-title { color: var(--color-text-100); }
    .modal-desc {
      font-size: var(--font-size-chat);
      font-weight: var(--font-weight-regular);
      color: var(--color-text-50);
      text-align: center;
      line-height: 1.5;
    }
    .modal-btn {
      width: 100%;
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      background: var(--color-primary);
      color: var(--color-text-100);
      font-size: var(--font-size-description-2);
      font-weight: var(--font-weight-bold);
      cursor: pointer;
      transition: background 120ms;
    }
    .modal-btn:hover { background: var(--color-primary-dark); }
  </style>
</head>
<body>
  <header>
    <a class="back-btn" href="profile.html" aria-label="뒤로가기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <h1 class="page-title">구매 내역</h1>
    <span></span>
  </header>

  <main id="main">
    <div class="initial-loading" id="initial-loading">
      <canvas id="initial-canvas"></canvas>
    </div>

    <div class="empty-state" id="empty-state" style="display:none;">
      <p>구매 내역이 없습니다.</p>
    </div>

    <div id="list"></div>
    <div class="sentinel" id="sentinel"></div>
    <div class="bottom-loader" id="bottom-loader">
      <canvas id="bottom-canvas"></canvas>
    </div>
    <div class="end-note" id="end-note">— 마지막 내역입니다 —</div>
  </main>

  <div class="modal-overlay" id="error-modal">
    <div class="modal-box">
      <p class="modal-title">오류가 발생했습니다</p>
      <p class="modal-desc">구매 내역을 불러오지 못했습니다.<br/>잠시 후 다시 시도해 주세요.</p>
      <button class="modal-btn" id="modal-close-btn">확인</button>
    </div>
  </div>

  <script type="module" src="./src/purchase-list.js"></script>
</body>
</html>
