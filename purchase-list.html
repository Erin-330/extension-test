<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RORR — 구매 내역</title>
  <link rel="stylesheet" href="./src/tokens.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-family-base);
      background-color: var(--color-background-light);
      color: var(--color-text-0);
      transition: background-color 200ms ease, color 200ms ease;
    }
    [data-theme="dark"] body {
      color: var(--color-text-100);
      background-color: var(--color-background-dark);
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header.top {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      align-items: center;
      padding: 14px 16px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }
    [data-theme="dark"] header.top {
      background: var(--color-surface-dark);
      border-bottom-color: var(--color-border-dark);
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-30-sub-text-dark);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 120ms, border-color 120ms;
    }
    [data-theme="dark"] .icon-btn {
      color: var(--color-text-90);
      border-color: var(--color-border-dark);
      background: var(--color-surface-dark);
    }
    .icon-btn:hover { border-color: var(--color-primary); }
    .icon-btn svg { width: 18px; height: 18px; }
    h1.title {
      text-align: center;
      font-weight: 700;
      font-size: 16px;
      line-height: 1.2;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 24px;
      gap: 10px;
    }

    .initial-loading {
      flex: 1;
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .initial-loading canvas {
      width: 250px;
      height: 250px;
      display: block;
    }

    /* Purchase card */
    .purchase-card {
      background: var(--color-surface);
      border-radius: 14px;
      padding: 14px;
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 14px;
      box-shadow: var(--shadow-light-surface);
      align-items: center;
    }
    [data-theme="dark"] .purchase-card { background: var(--color-surface-alt-dark); }

    .energy-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: var(--gradient-boost-energy-4-bg);
      color: var(--color-text-100);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--shadow-light-surface);
    }
    .energy-icon svg { width: 28px; height: 28px; }

    .pc-right {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 8px;
      align-items: center;
      min-width: 0;
    }
    .energy-count {
      grid-column: 1 / 3;
      font-weight: 700;
      font-size: 20px;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
      color: var(--color-text-0);
    }
    [data-theme="dark"] .energy-count { color: var(--color-text-100); }
    .energy-count .unit {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-boost-energy-4-icon);
      margin-left: 4px;
      letter-spacing: 0.04em;
    }
    .tx-code {
      grid-column: 1 / 3;
      font-size: 11px;
      color: var(--color-text-50);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .payed-date {
      font-size: 12px;
      color: var(--color-text-50);
    }
    .expire-info {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--color-text-50);
      font-weight: 700;
      letter-spacing: 0.02em;
      justify-self: end;
    }
    .expire-info.warn { color: var(--color-accent); }
    .expire-info.expired { color: var(--color-error); }
    .expire-info svg { width: 12px; height: 12px; }

    .sentinel { width: 100%; height: 1px; }
    .bottom-loader {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 8px 0 16px;
    }
    .bottom-loader.active { display: flex; }
    .bottom-loader canvas {
      width: 80px;
      height: 80px;
      display: block;
    }

    .end-note {
      display: none;
      text-align: center;
      font-size: 11px;
      color: var(--color-text-50);
      padding: 8px 0 16px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .end-note.active { display: block; }

    .empty-state {
      flex: 1;
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
    }
    .empty-state .title-text {
      font-weight: 700;
      font-size: 18px;
      color: var(--color-text-0);
    }
    [data-theme="dark"] .empty-state .title-text { color: var(--color-text-100); }
    .empty-state .desc-text {
      font-size: 13px;
      color: var(--color-text-50);
      text-align: center;
      max-width: 280px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="icon-btn" href="profile.html" aria-label="뒤로가기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <h1 class="title">Purchase List</h1>
    <span></span>
  </header>

  <main id="main">
    <div class="initial-loading" id="initial-loading">
      <canvas id="initial-loading-canvas"></canvas>
    </div>

    <div class="empty-state" id="empty-state" style="display:none;">
      <div class="title-text">No purchases yet</div>
      <div class="desc-text">Your energy purchase history will appear here.</div>
    </div>

    <div id="list"></div>
    <div class="sentinel" id="sentinel"></div>
    <div class="bottom-loader" id="bottom-loader">
      <canvas id="bottom-loader-canvas"></canvas>
    </div>
    <div class="end-note" id="end-note">— end of purchases —</div>
  </main>

  <script type="module" src="./src/purchase-list.js"></script>
</body>
</html>
