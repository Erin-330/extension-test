<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RORR — 경기 일정</title>
  <link rel="stylesheet" href="./src/tokens.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-family-base);
      background-color: var(--color-background-light);
      color: var(--color-text-0);
      transition: background-color 200ms ease, color 200ms ease;
    }
    [data-theme="dark"] body {
      color: var(--color-text-100);
      background-color: var(--color-background-dark);
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    header.top {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      align-items: center;
      padding: 14px 16px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }
    [data-theme="dark"] header.top {
      background: var(--color-surface-dark);
      border-bottom-color: var(--color-border-dark);
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-30-sub-text-dark);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 120ms, border-color 120ms;
    }
    [data-theme="dark"] .icon-btn {
      color: var(--color-text-90);
      border-color: var(--color-border-dark);
      background: var(--color-surface-dark);
    }
    .icon-btn:hover { border-color: var(--color-primary); }
    .icon-btn svg { width: 18px; height: 18px; }
    h1.title {
      text-align: center;
      font-weight: 700;
      font-size: 18px;
      line-height: 1.2;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 24px;
      gap: 12px;
      position: relative;
    }

    /* Initial loading */
    .initial-loading {
      flex: 1;
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .initial-loading canvas {
      width: 250px;
      height: 250px;
      display: block;
    }

    /* Empty state (NoScheduleRive) */
    .empty-state {
      flex: 1;
      min-height: 60vh;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .empty-state canvas {
      width: 240px;
      height: 240px;
      display: block;
    }
    .empty-state .empty-text {
      font-size: 14px;
      color: var(--color-text-50);
    }

    /* Date label */
    .date-label {
      font-weight: 700;
      font-size: 13px;
      line-height: 1.2;
      letter-spacing: 0.04em;
      color: var(--color-text-50);
      padding: 12px 4px 4px;
    }

    /* Match list */
    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      list-style: none;
    }

    /* MatchScoreCard */
    .match-card {
      background: var(--color-surface);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow-light-surface);
      cursor: pointer;
      transition: transform 120ms, box-shadow 120ms, background 120ms;
      border: 1px solid transparent;
    }
    [data-theme="dark"] .match-card {
      background: var(--color-surface-alt-dark);
    }
    .match-card:hover {
      transform: translateY(-1px);
      border-color: var(--color-primary);
    }
    .match-card .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .match-card .game-league {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .match-card .game-label {
      font-weight: 700;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--gradient-boosterwall);
      color: var(--color-text-100);
      letter-spacing: 0.06em;
    }
    .match-card .league-label {
      font-weight: 700;
      font-size: 12px;
      color: var(--color-text-50);
    }
    .match-card .status-badge {
      font-weight: 700;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      letter-spacing: 0.06em;
      color: var(--color-text-100);
    }
    .status-badge.finished { background: var(--color-text-50); }
    .status-badge.running {
      background: var(--color-status-color-live);
      position: relative;
    }
    .status-badge.running::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-text-100);
      margin-right: 4px;
      vertical-align: middle;
      animation: blink 1.2s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .status-badge.not_started {
      background: var(--color-status-color-upcoming);
    }

    .match-card .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }
    .match-card .team {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .match-card .team.right { justify-content: flex-end; }
    .match-card .team-logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--color-surface2-alt);
      color: var(--color-text-30-sub-text-dark);
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }
    [data-theme="dark"] .match-card .team-logo {
      background: var(--color-surface-dark);
      color: var(--color-text-90);
    }
    .match-card .team-name {
      font-weight: 700;
      font-size: 14px;
      line-height: 1.2;
      color: var(--color-text-0);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    [data-theme="dark"] .match-card .team-name { color: var(--color-text-100); }

    .match-card .score {
      display: flex;
      align-items: center;
      gap: 6px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 18px;
      color: var(--color-text-0);
      padding: 0 4px;
    }
    [data-theme="dark"] .match-card .score { color: var(--color-text-100); }
    .match-card .score .sep { color: var(--color-text-50); font-size: 14px; }
    .match-card .score .time {
      font-size: 13px;
      font-weight: 700;
      color: var(--color-text-50);
    }

    /* Bottom loader / end-note */
    .bottom-loader {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
    }
    .bottom-loader.active { display: flex; }
    .bottom-loader canvas {
      width: 80px;
      height: 80px;
      display: block;
    }
    .end-note {
      display: none;
      text-align: center;
      font-size: 12px;
      color: var(--color-text-50);
      padding: 12px 0 4px;
    }
    .end-note.active { display: block; }

    /* Today FAB */
    .today-fab {
      position: fixed;
      right: 16px;
      bottom: 20px;
      height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      border: none;
      background: var(--gradient-boosterwall);
      color: var(--color-text-100);
      font-family: var(--font-family-base);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: var(--shadow-light-surface-2);
      display: none;
      align-items: center;
      gap: 6px;
      z-index: 20;
      transition: filter 120ms, transform 120ms;
    }
    .today-fab.visible { display: inline-flex; }
    .today-fab:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .today-fab svg { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <header class="top">
    <a class="icon-btn" href="profile.html" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </a>
    <h1 class="title">경기 일정</h1>
    <button class="icon-btn" id="filter-btn" type="button" aria-label="리그 필터">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
    </button>
  </header>

  <main>
    <div class="initial-loading" id="initial-loading">
      <canvas id="initial-loading-canvas"></canvas>
    </div>

    <div class="empty-state" id="empty-state">
      <canvas id="no-schedule-canvas"></canvas>
      <div class="empty-text">표시할 경기가 없습니다</div>
    </div>

    <ul class="schedule-list" id="schedule-list"></ul>

    <div class="bottom-loader" id="bottom-loader">
      <canvas id="bottom-loader-canvas"></canvas>
    </div>

    <div class="end-note" id="end-note">— 마지막 경기 —</div>
  </main>

  <button class="today-fab" id="today-fab" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    Today
  </button>

  <script type="module" src="./src/schedule.js"></script>
</body>
</html>
