<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>RORR</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" crossorigin />
  <link rel="stylesheet" href="./src/tokens.css" />
  <style>
    html, body {
      width: 100%;
      min-height: 100vh;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .brand-emblem {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
      background: var(--gradient-boosterwall);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--color-text-50);
      transition: border-color 120ms, background 120ms;
    }
    .theme-toggle:hover {
      background: var(--color-surface2-alt);
      border-color: var(--color-primary);
    }

    /* Google login button (header) */
    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-30);
      font-family: var(--font-family-base);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
    }
    .google-btn:hover {
      background: var(--color-surface2-alt);
      border-color: var(--color-primary);
    }

    /* Avatar button (logged in) */
    .avatar-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--color-border);
      background: var(--gradient-boosterwall);
      color: var(--color-text-100);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 120ms, transform 120ms;
    }
    .avatar-btn:hover {
      border-color: var(--color-primary);
      transform: translateY(-1px);
    }

    /* Main */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    .hero {
      text-align: center;
      max-width: 480px;
    }
    .hero img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      margin-bottom: 16px;
    }
    .hero h1 {
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 8px;
      background: var(--gradient-boosterwall);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p {
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: var(--color-text-50);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 14px 20px;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.2;
      color: var(--color-text-50);
    }

    /* Profile popup overlay */
    .profile-overlay {
      position: fixed;
      inset: 0;
      background: var(--color-background-light);
      background: rgba(0, 0, 0, 0.3);
      display: none;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 64px 24px 24px;
      z-index: 100;
    }
    .profile-overlay.is-open {
      display: flex;
    }

    .profile-card {
      width: 320px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      box-shadow: var(--shadow-light-surface);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .profile-head {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .profile-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--gradient-boosterwall);
      color: var(--color-text-100);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .profile-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-0);
      line-height: 1.25;
    }
    .profile-email {
      font-size: 14px;
      font-weight: 400;
      color: var(--color-text-50);
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-divider {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 0;
    }

    .profile-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .profile-menu a {
      display: block;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--color-text-30);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background 120ms, color 120ms;
    }
    .profile-menu a:hover {
      background: var(--color-surface2-alt);
      color: var(--color-primary);
    }

    .logout-btn {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-30);
      font-family: var(--font-family-base);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 120ms, border-color 120ms, color 120ms;
    }
    .logout-btn:hover {
      background: var(--color-surface2-alt);
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./index.html">
      <img class="brand-emblem" src="https://erin-bucket-team.s3.amazonaws.com/RORR%20EMBLEM.png" alt="RORR 엠블럼" />
      <span class="brand-name">RORR</span>
    </a>

    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">
        <span id="themeIcon">☀️</span>
      </button>

      <!-- 비로그인 상태 -->
      <button class="google-btn" id="googleSignIn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google로 로그인
      </button>

      <!-- 로그인 상태 (초기 hidden) -->
      <button class="avatar-btn" id="avatarBtn" aria-label="프로필 열기" hidden>M</button>
    </div>
  </header>

  <main>
    <div class="hero">
      <img src="https://erin-bucket-team.s3.amazonaws.com/RORR%20EMBLEM.png" alt="RORR 엠블럼" />
      <h1>RORR</h1>
      <p>스포츠를 더 즐겁게, 함께</p>
    </div>
  </main>

  <footer>ⓒPitch Interactive Co.,LTD. All rights reserved</footer>

  <!-- 프로필 팝업 -->
  <div class="profile-overlay" id="profileOverlay" role="dialog" aria-modal="true" aria-labelledby="profileName">
    <div class="profile-card" id="profileCard">
      <div class="profile-head">
        <div class="profile-avatar" aria-hidden="true">M</div>
        <div class="profile-info">
          <span class="profile-name" id="profileName">Minhui</span>
          <span class="profile-email">erin@rorr.club</span>
        </div>
      </div>

      <hr class="profile-divider" />

      <ul class="profile-menu">
        <li><a href="#">Follow Team &amp; Player</a></li>
        <li><a href="#">Purchase List</a></li>
        <li><a href="#">Boost List</a></li>
        <li><a href="https://dev-app.rorr.club" target="_blank" rel="noopener">dev-app.rorr.club</a></li>
        <li><a href="#">Terms of Use</a></li>
        <li><a href="#">Privacy Policy</a></li>
      </ul>

      <hr class="profile-divider" />

      <button class="logout-btn" id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <script type="module">
    // Theme toggle
    const html = document.documentElement
    const toggleBtn = document.getElementById('themeToggle')
    const themeIcon = document.getElementById('themeIcon')

    const saved = localStorage.getItem('theme')
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
    const initial = saved ?? (prefersDark ? 'dark' : 'light')

    function applyTheme(theme) {
      html.dataset.theme = theme
      themeIcon.textContent = theme === 'dark' ? '🌙' : '☀️'
      localStorage.setItem('theme', theme)
    }
    applyTheme(initial)

    toggleBtn.addEventListener('click', () => {
      const next = html.dataset.theme === 'dark' ? 'light' : 'dark'
      applyTheme(next)
    })

    // Auth UI state
    const googleBtn = document.getElementById('googleSignIn')
    const avatarBtn = document.getElementById('avatarBtn')
    const overlay = document.getElementById('profileOverlay')
    const card = document.getElementById('profileCard')
    const logoutBtn = document.getElementById('logoutBtn')

    function setLoggedIn(loggedIn) {
      googleBtn.hidden = loggedIn
      avatarBtn.hidden = !loggedIn
    }

    function openProfile() {
      overlay.classList.add('is-open')
    }
    function closeProfile() {
      overlay.classList.remove('is-open')
    }

    googleBtn.addEventListener('click', () => {
      setLoggedIn(true)
      openProfile()
    })

    avatarBtn.addEventListener('click', openProfile)

    logoutBtn.addEventListener('click', () => {
      closeProfile()
      setLoggedIn(false)
    })

    overlay.addEventListener('click', (e) => {
      if (!card.contains(e.target)) closeProfile()
    })

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeProfile()
    })
  </script>
</body>
</html>
