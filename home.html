<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RORR 프로필</title>
    <link rel="stylesheet" href="./src/tokens.css" />
    <link rel="stylesheet" href="./src/home/home.css" />
  </head>
  <body>
    <main class="home-page" id="home-page">
      <section class="loading" id="loading" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <p class="loading-text">프로필을 불러오는 중...</p>
      </section>

      <section class="profile" id="profile" hidden>
        <header class="profile-header">
          <h1 class="profile-title">내 프로필</h1>
          <button id="logout-btn" type="button" class="logout-btn">로그아웃</button>
        </header>

        <div class="profile-card">
          <div class="avatar-ring" id="avatar-ring" data-grade="participant">
            <div class="avatar" id="avatar">
              <svg class="avatar-fallback" viewBox="0 0 24 24" width="48" height="48" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.4c-3.3 0-9.8 1.6-9.8 4.9v2.5h19.6v-2.5c0-3.3-6.5-4.9-9.8-4.9z"
                />
              </svg>
            </div>
          </div>

          <p class="email" id="email" title=""></p>
          <h2 class="displayname" id="displayname"></h2>

          <div class="stats">
            <div class="stat stat-spark">
              <span class="stat-label">Spark</span>
              <span class="stat-value spark-value" id="exp">0</span>
            </div>
            <div class="stat stat-grade">
              <span class="stat-label">등급</span>
              <span class="stat-value grade-value" id="grade-name">—</span>
            </div>
            <div class="stat stat-energy">
              <span class="stat-label">에너지</span>
              <span class="stat-value energy-value" id="cash">0</span>
            </div>
          </div>
        </div>
      </section>

      <section class="error-state" id="error-state" hidden>
        <p class="error-text" id="error-text">프로필 정보를 불러오지 못했습니다.</p>
        <button id="retry-btn" type="button" class="retry-btn">다시 시도</button>
      </section>
    </main>

    <script type="module" src="./src/home/main.js"></script>
  </body>
</html>
