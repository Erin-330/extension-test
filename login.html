<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RORR 로그인</title>
    <link rel="stylesheet" href="./src/tokens.css" />
    <link rel="stylesheet" href="./src/login/login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="brand">
        <img
          class="emblem"
          src="https://erin-bucket-team.s3.amazonaws.com/RORR%20EMBLEM.png"
          alt="RORR"
        />
        <p class="brand-tagline">스포츠를 더 즐겁게, 함께</p>
      </section>

      <section class="auth">
        <button id="google-login-btn" type="button" class="google-btn">
          <span class="google-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.76h3.56c2.08-1.92 3.28-4.74 3.28-8.09z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.76c-.98.66-2.24 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.11A6.6 6.6 0 0 1 5.49 12c0-.73.13-1.45.35-2.11V7.05H2.18A11 11 0 0 0 1 12c0 1.78.43 3.46 1.18 4.95l3.66-2.84z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.65l3.15-3.15C17.46 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.05l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"
              />
            </svg>
          </span>
          <span class="btn-label">Google로 계속하기</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
      </section>

      <p class="legal">
        계속 진행 시 RORR의 <a href="#">서비스 이용약관</a> 및 <a href="#">개인정보 처리방침</a>에 동의하게 됩니다.
      </p>
    </main>

    <script type="module" src="./src/login/main.js"></script>
  </body>
</html>
