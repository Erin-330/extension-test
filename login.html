<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RORR · 로그인</title>
  <link rel="stylesheet" href="src/tokens.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--color-surface);
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: var(--shadow-light-surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .login-card .emblem {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }
    .brand-title {
      font-weight: 700;
      font-size: 32px;
      background: var(--gradient-boosterwall);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 0.04em;
    }
    .tagline {
      font-weight: 400;
      font-size: 14px;
      color: var(--color-text-50);
      margin-top: -8px;
    }
    .divider {
      width: 100%;
      height: 1px;
      background: var(--color-border);
      margin: 8px 0;
    }
    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: var(--color-surface);
      color: var(--color-text-30-sub-text-dark);
      font-weight: 700;
      font-size: 16px;
      transition: background 120ms, border-color 120ms;
    }
    [data-theme="dark"] .google-btn { color: var(--color-text-90); }
    .google-btn:hover {
      background: var(--color-surface2-alt);
      border-color: var(--color-primary);
    }
    .google-btn:active { transform: translateY(1px); }
    .google-btn svg { width: 20px; height: 20px; }

    .legal-links {
      display: flex;
      gap: 16px;
      font-size: 12px;
    }
    .legal-links a {
      color: var(--color-text-50);
      transition: color 120ms;
    }
    .legal-links a:hover { color: var(--color-primary); }
    .legal-links span { color: var(--color-border); }

    .footer {
      text-align: center;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      font-size: 12px;
      color: var(--color-text-50);
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" aria-label="테마 전환">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
    </svg>
  </button>

  <div class="login-wrap">
    <div class="login-card">
      <img class="emblem" src="https://erin-bucket-team.s3.amazonaws.com/RORR%20EMBLEM.png" alt="RORR" />
      <div class="brand-title">RORR</div>
      <div class="tagline">스포츠를 더 즐겁게, 함께</div>

      <div class="divider"></div>

      <button class="google-btn" id="google-signin">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.5 6.2 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34.5 6.2 29.5 4 24 4 16.3 4 9.6 8.4 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.4l-6.5-5.5c-2 1.5-4.6 2.4-7.5 2.4-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.4 39.5 16.1 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.5 5.5c-.4.4 7.2-5.3 7.2-15 0-1.2-.1-2.3-.4-3.5z"/>
        </svg>
        <span>Google로 계속하기</span>
      </button>

      <div class="legal-links">
        <a href="#" aria-label="이용약관">이용약관</a>
        <span aria-hidden="true">|</span>
        <a href="#" aria-label="개인정보처리방침">개인정보처리방침</a>
      </div>
    </div>
  </div>

  <div class="footer">ⓒPitch Interactive Co.,LTD. All rights reserved</div>

  <script>
    // Theme persistence
    const root = document.documentElement;
    const stored = localStorage.getItem('theme');
    if (stored === 'dark') root.dataset.theme = 'dark';
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      if (next === 'dark') root.dataset.theme = 'dark';
      else delete root.dataset.theme;
      localStorage.setItem('theme', next);
    });

    // Google OAuth stub — proceed to profile page
    document.getElementById('google-signin').addEventListener('click', () => {
      window.location.href = 'profile.html';
    });
  </script>
</body>
</html>
