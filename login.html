<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RORR — 로그인</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
  <link rel="stylesheet" href="./src/tokens.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-family-base);
      background-color: var(--color-background-light);
      color: var(--color-text-0);
      transition: background-color 200ms ease, color 200ms ease;
    }
    [data-theme="dark"] { color: var(--color-text-100); }

    body {
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 24px;
    }

    .login-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .emblem {
      width: 96px;
      height: 96px;
      object-fit: contain;
    }

    .auth-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .message {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: var(--font-size-chat);
      font-weight: var(--font-weight-regular);
      line-height: var(--line-height-20);
      text-align: center;
      border: 1px solid transparent;
    }
    .message[data-type="error"] {
      background: color-mix(in srgb, var(--color-error) 10%, transparent);
      color: var(--color-error);
      border-color: color-mix(in srgb, var(--color-error) 30%, transparent);
    }
    .message[data-type="info"] {
      background: color-mix(in srgb, var(--color-primary) 10%, transparent);
      color: var(--color-primary);
      border-color: color-mix(in srgb, var(--color-primary) 30%, transparent);
    }

    .google-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-0);
      font-family: var(--font-family-base);
      font-size: var(--font-size-description-2);
      font-weight: var(--font-weight-bold);
      line-height: var(--line-height-20);
      cursor: pointer;
      box-shadow: var(--shadow-light-surface);
      transition: background 120ms, border-color 120ms;
    }
    [data-theme="dark"] .google-btn {
      background: var(--color-surface-dark);
      border-color: var(--color-border-dark);
      color: var(--color-text-100);
      box-shadow: var(--shadow-dark-surface);
    }
    .google-btn:hover:not(:disabled) {
      border-color: var(--color-primary);
    }
    .google-btn:active:not(:disabled) {
      transform: translateY(1px);
    }
    .google-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .google-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .legal {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .legal a {
      font-size: var(--font-size-annotation);
      font-weight: var(--font-weight-regular);
      line-height: var(--line-height-tight);
      color: var(--color-text-50);
      text-decoration: none;
      transition: color 120ms;
    }
    .legal a:hover { color: var(--color-primary); }
    .legal-sep {
      width: 1px;
      height: 10px;
      background: var(--color-border);
    }
    [data-theme="dark"] .legal-sep { background: var(--color-border-dark); }

    footer {
      padding: 16px 24px 24px;
      text-align: center;
      font-size: var(--font-size-annotation);
      font-weight: var(--font-weight-regular);
      line-height: var(--line-height-tight);
      color: var(--color-text-50);
    }
  </style>
</head>
<body>
  <main>
    <div class="login-box">
      <img
        class="emblem"
        src="https://erin-bucket-team.s3.amazonaws.com/RORR%20EMBLEM.png"
        alt="RORR"
      />

      <div class="auth-section">
        <div class="message" id="message" data-type="error" hidden></div>

        <button class="google-btn" id="google-btn">
          <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
            <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
            <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
            <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
          </svg>
          <span id="btn-label">Google로 계속하기</span>
        </button>

        <div class="legal">
          <a href="#" id="terms-link">이용약관</a>
          <span class="legal-sep" aria-hidden="true"></span>
          <a href="#" id="privacy-link">개인정보처리방침</a>
        </div>
      </div>
    </div>
  </main>

  <footer>ⓒPitch Interactive Co.,LTD. All rights reserved</footer>

  <script type="module" src="./src/login.js"></script>
</body>
</html>
