<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RORR · 로그인</title>
    <link rel="stylesheet" href="./src/tokens.css" />
    <link rel="stylesheet" href="./src/login/login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="brand">
        <img
          class="emblem"
          src="https://erin-bucket-team.s3.amazonaws.com/RORR%20EMBLEM.png"
          alt="RORR"
        />
        <h1 class="brand-title">RORR</h1>
        <p class="brand-tagline">스포츠를 더 즐겁게, 함께</p>
      </section>

      <section class="cta">
        <button id="google-login" class="google-btn" type="button">
          <svg class="g-icon" width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.4 29.4 35.5 24 35.5c-6.3 0-11.5-5.1-11.5-11.5S17.7 12.5 24 12.5c3 0 5.6 1.1 7.6 3l5.7-5.7C33.7 6.4 29.1 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12.5 24 12.5c3 0 5.6 1.1 7.6 3l5.7-5.7C33.7 6.4 29.1 4.5 24 4.5 16.3 4.5 9.7 8.7 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 43.5c5 0 9.6-1.9 13.1-5l-6-5.1c-2 1.5-4.5 2.4-7.1 2.4-5.3 0-9.8-3.1-11.3-7.5l-6.5 5C9.6 39.2 16.2 43.5 24 43.5z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.2 5.4l6 5.1c-.4.4 6.4-4.7 6.4-14.5 0-1.2-.1-2.4-.4-3.5z"/>
          </svg>
          <span class="g-label">Google로 계속하기</span>
        </button>
        <p id="login-status" class="login-status" role="status" aria-live="polite"></p>
      </section>

      <p class="footer-note">로그인 시 RORR 서비스 이용 약관 및 개인정보 처리방침에 동의하게 됩니다.</p>
    </main>

    <script type="module" src="./src/login/main.js"></script>
  </body>
</html>
