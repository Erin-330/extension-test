<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RORR — 로그인</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-light-surface);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 120ms linear, border-color 120ms linear, color 200ms ease;
      color: var(--color-text-30-sub-text-dark);
      z-index: 10;
    }
    .theme-toggle:hover {
      background: var(--color-surface2-alt);
      border-color: var(--color-primary);
    }
    [data-theme="dark"] .theme-toggle {
      color: var(--color-text-90);
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--color-surface);
      box-shadow: var(--shadow-light-surface);
      border-radius: 16px;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .emblem {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .brand-title {
      font-weight: 700;
      font-size: 32px;
      letter-spacing: 0;
      margin: 0;
      background: var(--gradient-boosterwall);
      -webkit-background-clip: text;
              background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .tagline {
      margin: 0;
      color: var(--color-text-50);
      text-align: center;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--color-border);
      margin: 4px 0;
    }

    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-30-sub-text-dark);
      font-weight: 700;
      font-size: 14px;
      transition: background 120ms linear, border-color 120ms linear;
    }
    .google-btn:hover {
      background: var(--color-surface2-alt);
      border-color: var(--color-primary);
    }
    .google-btn:active {
      transform: translateY(1px);
    }
    [data-theme="dark"] .google-btn {
      color: var(--color-text-90);
    }

    .legal {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-top: 4px;
    }
    .legal a {
      color: var(--color-text-50);
      font-weight: 400;
      font-size: 12px;
      line-height: 1.2;
      transition: color 120ms linear;
    }
    .legal a:hover { color: var(--color-primary); }
    .legal-sep {
      color: var(--color-text-50);
      font-size: 12px;
    }

    footer {
      padding: 20px;
      text-align: center;
      color: var(--color-text-50);
      font-weight: 400;
      font-size: 12px;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="테마 전환" title="테마 전환">🌙</button>

  <main>
    <section class="login-card" role="region" aria-label="RORR 로그인">
      <img class="emblem" src="https://erin-bucket-team.s3.amazonaws.com/RORR%20EMBLEM.png" alt="RORR 엠블럼" />
      <h1 class="brand-title">RORR</h1>
      <p class="tagline text-chat">스포츠를 더 즐겁게, 함께</p>

      <div class="divider" aria-hidden="true"></div>

      <button class="google-btn" type="button" aria-label="Google로 계속하기">
        <svg width="20" height="20" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
        </svg>
        <span>Google로 계속하기</span>
      </button>

      <div class="legal">
        <a href="#" aria-label="이용약관">이용약관</a>
        <span class="legal-sep" aria-hidden="true">|</span>
        <a href="#" aria-label="개인정보처리방침">개인정보처리방침</a>
      </div>
    </section>
  </main>

  <footer>ⓒPitch Interactive Co.,LTD. All rights reserved</footer>

  <script>
    (function () {
      var root = document.documentElement;
      var stored = localStorage.getItem('theme');
      var initial = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      root.dataset.theme = initial;

      var toggle = document.getElementById('themeToggle');
      function syncIcon() {
        toggle.textContent = root.dataset.theme === 'dark' ? '☀️' : '🌙';
      }
      syncIcon();

      toggle.addEventListener('click', function () {
        var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        localStorage.setItem('theme', next);
        syncIcon();
      });
    })();
  </script>
</body>
</html>
