<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RORR — 로그인</title>
    <link rel="stylesheet" href="./src/tokens.css" />
    <link rel="stylesheet" href="./src/login/login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="brand">
        <img
          class="emblem"
          src="https://erin-bucket-team.s3.amazonaws.com/RORR%20EMBLEM.png"
          alt="RORR"
        />
        <p class="brand-description">스포츠를 더 즐겁게, 함께</p>
      </section>

      <section class="actions">
        <div id="status-message" class="status-message" role="status" aria-live="polite"></div>

        <button id="google-login-btn" class="google-btn" type="button">
          <svg class="google-icon" aria-hidden="true" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path
              fill="#4285F4"
              d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.614z"
            />
            <path
              fill="#34A853"
              d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.583-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"
            />
            <path
              fill="#FBBC05"
              d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"
            />
            <path
              fill="#EA4335"
              d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"
            />
          </svg>
          <span class="google-btn-label">Google로 계속하기</span>
          <span class="google-btn-spinner" aria-hidden="true"></span>
        </button>

        <p class="legal-notice">
          계속하면 RORR의 <a href="#" class="legal-link">서비스 약관</a> 및
          <a href="#" class="legal-link">개인정보 처리방침</a>에 동의하는 것으로 간주됩니다.
        </p>
      </section>
    </main>

    <script type="module" src="./src/login/main.js"></script>
  </body>
</html>
