<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RORR — 로그인</title>
    <link rel="stylesheet" href="./src/tokens.css" />
    <link rel="stylesheet" href="./src/login/login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="brand">
        <img
          class="emblem"
          src="https://erin-bucket-team.s3.amazonaws.com/RORR%20EMBLEM.png"
          alt="RORR"
        />
        <p class="tagline">스포츠를 더 즐겁게, 함께</p>
      </section>

      <button id="google-login" class="google-btn" type="button">
        <span class="g-icon" aria-hidden="true">G</span>
        <span class="g-label">Google로 계속하기</span>
      </button>

      <p id="login-status" class="status" role="status" aria-live="polite"></p>

      <p class="footnote">로그인하면 RORR 이용약관에 동의하게 됩니다.</p>
    </main>

    <script type="module" src="./src/login/main.js"></script>
  </body>
</html>
