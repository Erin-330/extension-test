<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>RORR · 프로필</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" crossorigin />
  <style>
    html, body {
      width: 100%;
      min-height: 100vh;
    }

    body {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--color-text-50);
      transition: border-color 120ms, background 120ms;
      z-index: 10;
    }
    .theme-toggle:hover { background: var(--color-surface2-alt); border-color: var(--color-primary); }

    .rank-link {
      position: absolute;
      top: 14px;
      left: 14px;
      background: none;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-50);
      transition: border-color 120ms, background 120ms, color 120ms;
      z-index: 10;
      text-decoration: none;
    }
    .rank-link:hover {
      background: var(--color-surface2-alt);
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .rank-link svg { display: block; }

    .profile-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 20px;
      gap: 16px;
    }

    .profile-card {
      background: var(--color-surface);
      border-radius: 20px;
      box-shadow: var(--shadow-light-surface);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--gradient-boosterwall);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-100);
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .email {
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: var(--color-text-50);
    }

    .stats-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-card {
      background: var(--color-surface);
      border-radius: 16px;
      box-shadow: var(--shadow-light-surface);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stat-label {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-text-50);
    }
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }
    .stat-card.energy .stat-value { color: #00b395; }
    .stat-card.boost  .stat-value { color: var(--color-secondary); }

    .menu-list {
      width: 100%;
      background: var(--color-surface);
      border-radius: 16px;
      box-shadow: var(--shadow-light-surface);
      overflow: hidden;
    }
    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-30);
      cursor: pointer;
      transition: background 120ms;
      border-bottom: 1px solid var(--color-border);
      text-decoration: none;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: var(--color-surface2-alt); }
    .menu-item .chev {
      color: var(--color-text-50);
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 14px 20px;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.2;
      color: var(--color-text-50);
    }
  </style>
  <script type="module" crossorigin src="/assets/profile-kl10J3Fd.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/tokens-g_pl08HU.js">
  <link rel="stylesheet" crossorigin href="/assets/tokens-B2fCUAyR.css">
</head>

      <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />

  <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">

  <main class="profile-main">

      <div class="avatar">E</div>

    <div class="stats-row">

    <div class="menu-list">

      </a>
      <a class="menu-item" href="#">
        <span>Terms of Use</span>
        <span class="chev">›</span>
      </a>
      <a class="menu-item" href="#">

      </a>
    </div>
  </main>

  <footer>ⓒPitch Interactive Co.,LTD. All rights reserved</footer>

</body>
</html>
