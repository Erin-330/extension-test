<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>RORR</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" crossorigin />
  <style>
    html, body {
      width: 100%;
      min-height: 100vh;
    }

    body {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--color-text-50);
      transition: border-color 120ms, background 120ms;
      z-index: 10;
    }
    .theme-toggle:hover { background: var(--color-surface2-alt); border-color: var(--color-primary); }

    .login-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px 20px;
    }

    .login-card {
      background: var(--color-surface);
      border-radius: 20px;
      box-shadow: var(--shadow-light-surface);
      padding: 32px 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 100%;
    }

    .emblem {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    .brand-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0;
      background: var(--gradient-boosterwall);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      line-height: 1;
    }

    .tagline {
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: var(--color-text-50);
      margin-bottom: 24px;
    }

    .divider {
      width: 100%;
      border: none;
      border-top: 1px solid var(--color-border);
      margin-bottom: 24px;
    }

    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-30);
      font-family: var(--font-family-base);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
      margin-bottom: 20px;
    }
    .google-btn:hover {
      background: var(--color-surface2-alt);
      border-color: var(--color-primary);
    }

    .google-icon {
      flex-shrink: 0;
    }

    .legal-links {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.2;
      color: var(--color-text-50);
    }
    .legal-links a {
      color: var(--color-text-50);
      text-decoration: none;
      transition: color 120ms;
    }
    .legal-links a:hover { color: var(--color-primary); }
    .legal-links span { color: var(--color-border); }

    footer {
      text-align: center;
      padding: 14px 20px;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.2;
      color: var(--color-text-50);
    }
  </style>
  <script type="module" crossorigin src="/assets/login-WZ1akoTP.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/login-B2fCUAyR.css">
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">
    <span id="themeIcon">☀️</span>
  </button>

  <main class="login-main">
    <div class="login-card">
      <img
        src="https://erin-bucket-team.s3.amazonaws.com/RORR%20EMBLEM.png"
        alt="RORR 엠블럼"
        class="emblem"
      />
      <h1 class="brand-title">RORR</h1>
      <p class="tagline">스포츠를 더 즐겁게, 함께</p>

      <hr class="divider" />

      <button class="google-btn" id="googleSignIn">
        <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google로 계속하기
      </button>

      <div class="legal-links">
        <a href="#">이용약관</a>
        <span>|</span>
        <a href="#">개인정보처리방침</a>
      </div>
    </div>
  </main>

  <footer>ⓒPitch Interactive Co.,LTD. All rights reserved</footer>

</body>
</html>
