<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RORR — Follow</title>
  <link rel="stylesheet" href="./src/tokens.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-family-base);
      background-color: var(--color-background-light);
      color: var(--color-text-0);
      transition: background-color 200ms ease, color 200ms ease;
    }
    [data-theme="dark"] body { color: var(--color-text-100); background-color: var(--color-background-dark); }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    header.top {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      align-items: center;
      padding: 14px 16px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }
    [data-theme="dark"] header.top {
      background: var(--color-surface-dark);
      border-bottom-color: var(--color-border-dark);
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-30-sub-text-dark);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 120ms, border-color 120ms;
    }
    [data-theme="dark"] .icon-btn { color: var(--color-text-90); border-color: var(--color-border-dark); background: var(--color-surface-dark); }
    .icon-btn:hover { border-color: var(--color-primary); }
    .icon-btn svg { width: 18px; height: 18px; }
    h1.title {
      text-align: center;
      font-weight: 700;
      font-size: 18px;
      line-height: 1.2;
    }

    /* Search */
    .search-wrap {
      padding: 12px 16px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }
    [data-theme="dark"] .search-wrap {
      background: var(--color-surface-dark);
      border-bottom-color: var(--color-border-dark);
    }
    .search-input {
      width: 100%;
      height: 40px;
      padding: 0 14px 0 36px;
      border-radius: 12px;
      border: 1px solid var(--color-border);
      background: var(--color-background-light) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23757b90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>') no-repeat 12px center;
      font-family: var(--font-family-base);
      font-size: 14px;
      color: var(--color-text-0);
      outline: none;
    }
    [data-theme="dark"] .search-input {
      color: var(--color-text-100);
      background-color: var(--color-surface-alt-dark);
      border-color: var(--color-border-dark);
    }
    .search-input:focus { border-color: var(--color-primary); }

    /* List */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      cursor: pointer;
      transition: border-color 120ms, background 120ms;
      position: relative;
    }
    [data-theme="dark"] .card {
      background: var(--color-surface-dark);
      border-color: var(--color-border-dark);
    }
    .card:hover { border-color: var(--color-primary); }
    .card.selected {
      border-color: var(--color-primary);
      background: var(--color-success-surface);
    }
    [data-theme="dark"] .card.selected { background: var(--color-surface-alt-dark); }

    .card .thumb {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--gradient-boosterwall);
      color: var(--color-text-100);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .card .info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .card .info .name {
      font-weight: 700;
      font-size: 15px;
      line-height: 1.2;
      color: var(--color-text-0);
    }
    [data-theme="dark"] .card .info .name { color: var(--color-text-100); }
    .card .info .sub {
      font-weight: 400;
      font-size: 12px;
      color: var(--color-text-50);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card .info .sub .team-logo {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--gradient-spark-color);
      display: inline-block;
    }
    .boost-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--gradient-spark-color);
      color: var(--color-text-100);
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.04em;
    }
    .order-badge {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--color-primary);
      color: var(--color-text-100);
      font-weight: 700;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .order-badge.hidden { display: none; }

    .empty-state {
      padding: 40px 16px;
      text-align: center;
      color: var(--color-text-50);
      font-size: 14px;
    }

    /* Footer / step indicator */
    footer.steps {
      position: sticky;
      bottom: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding: 12px 16px 16px;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
    }
    [data-theme="dark"] footer.steps {
      background: var(--color-surface-dark);
      border-top-color: var(--color-border-dark);
    }
    .step-btn {
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-0);
      font-family: var(--font-family-base);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 120ms, color 120ms, border-color 120ms;
    }
    [data-theme="dark"] .step-btn {
      background: var(--color-surface-alt-dark);
      border-color: var(--color-border-dark);
      color: var(--color-text-100);
    }
    .step-btn.primary {
      background: var(--gradient-boosterwall);
      color: var(--color-text-100);
      border: none;
    }
    .step-btn.primary:hover { background: var(--gradient-boosterwall-hover); }
    .step-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .dots { display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-text-80-sub-text-light);
    }
    .dot.active { background: var(--color-primary); }
  </style>
</head>
<body>
  <header class="top">
    <a class="icon-btn" id="back-btn" href="profile.html" aria-label="뒤로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <h1 class="title" id="step-title">Back Your League</h1>
    <a class="icon-btn" href="profile.html" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </a>
  </header>

  <div class="search-wrap">
    <input id="search" class="search-input" type="text" placeholder="검색" />
  </div>

  <main id="list"></main>

  <footer class="steps">
    <button class="step-btn" id="prev-btn">← 이전</button>
    <div class="dots">
      <span class="dot active" id="dot-1"></span>
      <span class="dot" id="dot-2"></span>
      <span class="dot" id="dot-3"></span>
    </div>
    <button class="step-btn primary" id="next-btn">다음 →</button>
  </footer>

  <script type="module" src="./src/follow.js"></script>
</body>
</html>
