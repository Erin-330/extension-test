<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RORR · 팔로우</title>
  <link rel="stylesheet" href="src/tokens.css" />
  <style>
    .page {
      padding: 16px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Tabs (segmented) */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--color-surface2-alt);
      border-radius: 999px;
      padding: 4px;
    }
    .tab {
      flex: 1;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      color: var(--color-text-50);
      text-align: center;
      transition: background 120ms, color 120ms, box-shadow 120ms;
    }
    .tab.active {
      background: var(--color-surface);
      color: var(--color-primary);
      box-shadow: var(--shadow-light-surface-2);
    }
    .tab .count {
      font-variant-numeric: tabular-nums;
      margin-left: 6px;
      font-size: 12px;
      opacity: 0.8;
    }

    /* Search */
    .search {
      position: relative;
    }
    .search input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: var(--color-surface);
      color: var(--color-text-30-sub-text-dark);
      font-size: 14px;
      font-family: inherit;
      transition: border-color 120ms, box-shadow 120ms;
    }
    [data-theme="dark"] .search input { color: var(--color-text-90); }
    .search input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-primary) 25%, transparent);
    }
    .search svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--color-text-50);
    }

    /* List */
    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .user-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--color-surface);
      border-radius: 14px;
      box-shadow: var(--shadow-light-surface-2);
    }
    .avatar-sm {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      color: var(--color-text-100);
      font-weight: 700;
      font-size: 16px;
    }
    .user-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .user-name {
      font-weight: 700;
      font-size: 15px;
      color: var(--color-text-30-sub-text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    [data-theme="dark"] .user-name { color: var(--color-text-100); }
    .user-bio {
      font-size: 12px;
      color: var(--color-text-50);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .follow-btn {
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--color-primary);
      background: var(--color-primary);
      color: var(--color-text-100);
      transition: background 120ms;
    }
    .follow-btn:hover { background: var(--color-primary-dark); }
    .follow-btn.is-following {
      background: transparent;
      color: var(--color-primary);
    }
    .follow-btn.is-following:hover {
      background: var(--color-surface2-alt);
    }

    .empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--color-text-50);
    }

    /* Avatar color helpers */
    .av-1 { background: linear-gradient(135deg, #2f9cfc, #6f4cff); }
    .av-2 { background: linear-gradient(135deg, #ff6f00, #ffb400); }
    .av-3 { background: linear-gradient(135deg, #11c72d, #00b395); }
    .av-4 { background: linear-gradient(135deg, #fe2054, #ffb400); }
    .av-5 { background: linear-gradient(135deg, #6f4cff, #8c6eff); }
    .av-6 { background: linear-gradient(135deg, #2d39b4, #209fee); }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <button class="icon-btn" onclick="window.location.href='profile.html'" aria-label="뒤로">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="h-title">팔로우</div>
      <button class="icon-btn" id="theme-toggle" aria-label="테마">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
      </button>
    </header>

    <main class="page">
      <div class="tabs" role="tablist">
        <button class="tab active" id="tab-followers" data-tab="followers" role="tab">
          팔로워<span class="count">1,248</span>
        </button>
        <button class="tab" id="tab-following" data-tab="following" role="tab">
          팔로잉<span class="count">312</span>
        </button>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input id="search-input" type="search" placeholder="이름 또는 닉네임 검색" />
      </div>

      <div class="list" id="user-list"></div>
    </main>

    <nav class="bottom-nav" aria-label="하단 네비게이션">
      <a href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        프로필
      </a>
      <a href="follow.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
        </svg>
        팔로우
      </a>
      <a href="rank.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4z"/>
        </svg>
        랭킹
      </a>
      <a href="login.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06A1.65 1.65 0 0015 19.4a1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09A1.65 1.65 0 0015 4.6a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        설정
      </a>
    </nav>
  </div>

  <script>
    // Theme
    const root = document.documentElement;
    if (localStorage.getItem('theme') === 'dark') root.dataset.theme = 'dark';
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      if (next === 'dark') root.dataset.theme = 'dark';
      else delete root.dataset.theme;
      localStorage.setItem('theme', next);
    });

    // Data
    const followers = [
      { name: '김지훈',   bio: 'KIA 타이거즈 팬',           initial: 'ㄱ', cls: 'av-1', following: false },
      { name: 'soccer_mary', bio: '⚽️ 토트넘 응원 · 매일 스트릭', initial: 'M', cls: 'av-2', following: true  },
      { name: '박서연',   bio: 'LCK 마니아 · T1 영원히',     initial: 'ㅂ', cls: 'av-3', following: true  },
      { name: 'hoops_lee', bio: 'NBA · 레이커스 1순위',      initial: 'L', cls: 'av-4', following: false },
      { name: '이도윤',   bio: '한화 이글스 7년차 팬',       initial: 'ㅇ', cls: 'av-5', following: true  },
      { name: '정민서',   bio: '두산 베어스 · 응원단장',     initial: 'ㅈ', cls: 'av-6', following: false },
      { name: 'pitch_dev', bio: 'RORR builder',              initial: 'P', cls: 'av-1', following: true  },
      { name: '한지유',   bio: '맨시티 · 손흥민 ❤️',        initial: 'ㅎ', cls: 'av-2', following: false },
    ];
    const following = [
      { name: 'pitch_team', bio: '공식 RORR 채널',          initial: 'R', cls: 'av-5', following: true },
      { name: '김도현',     bio: '경기 분석가',              initial: 'ㄱ', cls: 'av-3', following: true },
      { name: 'lcs_watcher', bio: 'LCS · LEC 매주 리뷰',     initial: 'L', cls: 'av-6', following: true },
      { name: '오세훈',     bio: '롯데 자이언츠',            initial: 'ㅇ', cls: 'av-4', following: true },
      { name: 'sara_x',     bio: '여자배구 · 흥국생명',      initial: 'S', cls: 'av-2', following: true },
      { name: '윤하늘',     bio: '농구 · KCC',               initial: 'ㅇ', cls: 'av-1', following: true },
    ];

    const listEl = document.getElementById('user-list');
    const searchEl = document.getElementById('search-input');
    let activeTab = (new URLSearchParams(location.search).get('tab') === 'following') ? 'following' : 'followers';
    let query = '';

    function render() {
      const data = (activeTab === 'followers' ? followers : following)
        .filter(u => !query || u.name.toLowerCase().includes(query) || u.bio.toLowerCase().includes(query));

      if (data.length === 0) {
        listEl.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
        return;
      }

      listEl.innerHTML = data.map((u, i) => `
        <div class="user-row">
          <div class="avatar-sm ${u.cls}">${u.initial}</div>
          <div class="user-meta">
            <div class="user-name">${u.name}</div>
            <div class="user-bio">${u.bio}</div>
          </div>
          <button class="follow-btn ${u.following ? 'is-following' : ''}" data-i="${i}">
            ${u.following ? '팔로잉' : '팔로우'}
          </button>
        </div>
      `).join('');

      listEl.querySelectorAll('.follow-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(e.currentTarget.dataset.i, 10);
          const arr = activeTab === 'followers' ? followers : following;
          arr[idx].following = !arr[idx].following;
          render();
        });
      });
    }

    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        activeTab = t.dataset.tab;
        const url = new URL(location.href);
        url.searchParams.set('tab', activeTab);
        history.replaceState(null, '', url);
        render();
      });
    });

    // Set initial active tab based on URL
    if (activeTab === 'following') {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.getElementById('tab-following').classList.add('active');
    }

    searchEl.addEventListener('input', (e) => {
      query = e.target.value.trim().toLowerCase();
      render();
    });

    render();
  </script>
</body>
</html>
