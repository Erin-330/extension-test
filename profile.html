<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RORR — 프로필</title>
  <link rel="stylesheet" href="./src/tokens.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-family-base);
      background-color: var(--color-background-light);
      color: var(--color-text-0);
      transition: background-color 200ms ease, color 200ms ease;
    }
    [data-theme="dark"] body { color: var(--color-text-100); }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .top-actions {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-30-sub-text-dark);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-light-surface-2);
      transition: background 120ms, border-color 120ms, filter 120ms;
      text-decoration: none;
      padding: 0;
    }
    [data-theme="dark"] .icon-btn { color: var(--color-text-90); }
    .icon-btn:hover { border-color: var(--color-primary); }
    .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn.streak-btn {
      background: var(--gradient-spark-color);
      border-color: transparent;
      color: var(--color-text-100);
    }
    .icon-btn.streak-btn:hover { filter: brightness(1.05); border-color: transparent; }
    [data-theme="dark"] .icon-btn.streak-btn { color: var(--color-text-100); }

    .icon-btn.quiz-btn {
      background: var(--gradient-quiz-color);
      border-color: transparent;
      color: var(--color-text-100);
    }
    .icon-btn.quiz-btn:hover { filter: brightness(1.05); border-color: transparent; }
    [data-theme="dark"] .icon-btn.quiz-btn { color: var(--color-text-100); }

    .icon-btn.event-btn {
      background: var(--color-status-color-live);
      border-color: transparent;
      color: var(--color-text-100);
      position: relative;
    }
    .icon-btn.event-btn::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 999px;
      box-shadow: 0 0 0 0 rgba(193, 15, 15, 0.55);
      animation: live-pulse 1.6s ease-out infinite;
      pointer-events: none;
    }
    @keyframes live-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(193, 15, 15, 0.55); }
      70%  { box-shadow: 0 0 0 8px rgba(193, 15, 15, 0); }
      100% { box-shadow: 0 0 0 0 rgba(193, 15, 15, 0); }
    }
    .icon-btn.event-btn:hover { filter: brightness(1.05); border-color: transparent; }
    [data-theme="dark"] .icon-btn.event-btn { color: var(--color-text-100); }

    .theme-toggle .sun { display: none; }
    [data-theme="dark"] .theme-toggle .sun { display: block; }
    [data-theme="dark"] .theme-toggle .moon { display: none; }

    main {
      width: 100%;
      padding: 56px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .identity {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 8px 0 4px;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--gradient-boosterwall);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-100);
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0;
      box-shadow: var(--shadow-light-surface);
      overflow: hidden;
    }
    .name {
      font-weight: 700;
      font-size: 20px;
      line-height: 1.2;
    }
    .email {
      font-weight: 400;
      font-size: 14px;
      line-height: 20px;
      color: var(--color-text-50);
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-card {
      border-radius: 14px;
      padding: 16px;
      color: var(--color-text-100);
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: var(--shadow-light-surface);
    }
    .stat-card .label {
      font-weight: 700;
      font-size: 12px;
      line-height: 1.2;
      letter-spacing: 0.08em;
      opacity: 0.85;
    }
    .stat-card .value {
      font-weight: 700;
      font-size: 24px;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }
    .stat-card.energy { background: var(--gradient-boost-energy-4-bg); }
    .stat-card.boost  { background: var(--gradient-quiz-color); }

    .menu {
      background: var(--color-surface);
      border-radius: 14px;
      box-shadow: var(--shadow-light-surface);
      overflow: hidden;
    }
    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      cursor: pointer;
      font-family: var(--font-family-base);
      font-weight: 400;
      font-size: 16px;
      line-height: 20px;
      color: var(--color-text-0);
      text-decoration: none;
      transition: background 120ms;
    }
    [data-theme="dark"] .menu-item { color: var(--color-text-100); }
    .menu-item + .menu-item {
      border-top: 1px solid var(--color-border);
    }
    .menu-item:hover { background: var(--color-surface2-alt); }
    .menu-item .chev {
      width: 16px;
      height: 16px;
      color: var(--color-text-50);
      flex-shrink: 0;
    }
    .menu-item .ext {
      font-size: 12px;
      color: var(--color-text-50);
    }

    footer {
      margin-top: auto;
      padding: 16px 24px 24px;
      text-align: center;
      font-weight: 400;
      font-size: 12px;
      line-height: 1.2;
      color: var(--color-text-50);
    }

    /* ---- Modal overlay (Quiz / Event Live) ---- */
    .modal {
      position: fixed;
      inset: 0;
      background: var(--color-background-b-30);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-card {
      position: relative;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-close {
      align-self: flex-end;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: none;
      background: var(--color-surface-floating);
      color: var(--color-text-0);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-light-surface-2);
    }
    [data-theme="dark"] .modal-close {
      background: var(--color-surface-floating-dark);
      color: var(--color-text-100);
    }
    .modal-close:hover { filter: brightness(1.05); }
    .modal-close svg { width: 16px; height: 16px; }

    .quiz-canvas-wrap {
      width: 100%;
      height: 456px;
      position: relative;
    }
    .event-canvas-wrap {
      width: 100%;
      aspect-ratio: 360 / 173;
      position: relative;
    }
    .modal canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .modal-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-surface);
      border-radius: 14px;
      color: var(--color-text-30-sub-text-dark);
      font-size: 14px;
      text-align: center;
      padding: 16px;
    }
    [data-theme="dark"] .modal-fallback {
      background: var(--color-surface-dark);
      color: var(--color-text-90);
    }
  </style>
</head>
<body>
  <div class="top-actions">
    <a class="icon-btn streak-btn" href="streak-history.html" aria-label="스트릭 히스토리">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s4 4 4 8a4 4 0 1 1-8 0c0-2 1-3 1-3s-2 2-2 5a6 6 0 0 0 12 0c0-6-7-10-7-10z"/></svg>
    </a>
    <a class="icon-btn" href="rank.html" aria-label="랭킹">

    <button class="icon-btn event-btn" id="event-open" aria-label="라이브 이벤트 열기" type="button">

    <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="테마 전환">

      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>

  </div>

  <main>

      <a class="menu-item" href="#terms">
        <span>Terms of Use</span>

      </a>
      <a class="menu-item" href="#privacy">
        <span>Privacy Policy</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>

    </nav>
  </main>

  <footer>ⓒPitch Interactive Co.,LTD. All rights reserved</footer>

  <!-- Quiz Modal -->
  <div class="modal" id="quiz-modal" role="dialog" aria-modal="true" aria-label="라이브 퀴즈">
    <div class="modal-card">
      <button class="modal-close" id="quiz-close" type="button" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

  <!-- Event Live Modal -->
  <div class="modal" id="event-modal" role="dialog" aria-modal="true" aria-label="라이브 이벤트">
    <div class="modal-card">
      <button class="modal-close" id="event-close" type="button" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

  <script type="module" src="./src/profile.js"></script>
</body>
</html>
