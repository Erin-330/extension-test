<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>RORR · 프로필</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" crossorigin />
  <link rel="stylesheet" href="./src/tokens.css" />
  <style>
    html, body {
      width: 100%;
      min-height: 100vh;
    }

    body {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--color-text-50);
      transition: border-color 120ms, background 120ms;
      z-index: 10;
    }
    .theme-toggle:hover { background: var(--color-surface2-alt); border-color: var(--color-primary); }

    .profile-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px 20px;
    }

    .profile-card {
      background: var(--color-surface);
      border-radius: 20px;
      box-shadow: var(--shadow-light-surface);
      padding: 32px 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
    }

    .emblem {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      background: var(--gradient-boosterwall);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
      line-height: 1;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--gradient-ai-profile);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-100);
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 16px;
      box-shadow: var(--shadow-light-surface-2);
    }

    .user-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-text-0);
      margin-bottom: 4px;
    }

    .user-email {
      font-size: 14px;
      font-weight: 400;
      color: var(--color-text-50);
      margin-bottom: 24px;
    }

    .divider {
      width: 100%;
      border: none;
      border-top: 1px solid var(--color-border);
      margin-bottom: 20px;
    }

    .stats {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px;
      background: var(--color-surface2-alt);
      border-radius: 12px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text-0);
      line-height: 1.2;
    }
    .stat-label {
      font-size: 12px;
      font-weight: 400;
      color: var(--color-text-50);
      margin-top: 4px;
    }

    .logout-btn {
      width: 100%;
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-30);
      font-family: var(--font-family-base);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
    }
    .logout-btn:hover {
      background: var(--color-surface2-alt);
      border-color: var(--color-primary);
    }

    footer {
      text-align: center;
      padding: 14px 20px;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.2;
      color: var(--color-text-50);
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">
    <span id="themeIcon">☀️</span>
  </button>

  <main class="profile-main">
    <div class="profile-card">
      <img
        src="https://erin-bucket-team.s3.amazonaws.com/RORR%20EMBLEM.png"
        alt="RORR 엠블럼"
        class="emblem"
      />
      <h1 class="brand-title">RORR</h1>

      <div class="avatar" id="avatar">E</div>
      <p class="user-name" id="userName">Erin</p>
      <p class="user-email" id="userEmail">erin@rorr.club</p>

      <hr class="divider" />

      <div class="stats">
        <div class="stat">
          <span class="stat-value">12</span>
          <span class="stat-label">참여</span>
        </div>
        <div class="stat">
          <span class="stat-value">8</span>
          <span class="stat-label">승리</span>
        </div>
        <div class="stat">
          <span class="stat-value">1,240</span>
          <span class="stat-label">포인트</span>
        </div>
      </div>

      <button class="logout-btn" id="logoutBtn">로그아웃</button>
    </div>
  </main>

  <footer>ⓒPitch Interactive Co.,LTD. All rights reserved</footer>

  <script type="module" src="./src/profile.js"></script>
</body>
</html>
