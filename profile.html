<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RORR — 프로필</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    body {
      min-height: 100vh;
      padding-bottom: 80px; /* space for bottom tab bar */
    }

    /* ---- Top Nav ---- */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--color-surface-floating);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border);
    }
    .nav-brand {
      font-weight: 700;
      font-size: 20px;
      background: var(--gradient-boosterwall);
      -webkit-background-clip: text;
              background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--color-text-30-sub-text-dark);
      transition: background 120ms linear, border-color 120ms linear;
    }
    .icon-btn:hover {
      background: var(--color-surface2-alt);
      border-color: var(--color-primary);
    }
    [data-theme="dark"] .icon-btn { color: var(--color-text-90); }

    /* ---- Page container ---- */
    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--color-surface);
      box-shadow: var(--shadow-light-surface);
      border-radius: 16px;
      padding: 20px;
    }

    /* ---- Hero ---- */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px 20px;
    }
    .avatar-ring {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--gradient-ai-profile-border);
      padding: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--color-surface2-alt);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 32px;
      color: var(--color-primary);
      object-fit: cover;
      overflow: hidden;
    }
    .nickname { margin: 4px 0 0; color: var(--color-text-0); }
    [data-theme="dark"] .nickname { color: var(--color-text-100); }
    .email { margin: 0; color: var(--color-text-50); }

    .resource-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-top: 8px;
    }
    .resource-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
    }
    .resource-card.energy { background: rgba(0, 179, 149, 0.12); }
    .resource-card.boost  { background: rgba(111, 76, 255, 0.12); }
    .resource-icon { font-size: 20px; }
    .resource-meta { display: flex; flex-direction: column; line-height: 1.2; }
    .resource-label {
      font-weight: 700; font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-50);
    }
    .resource-value {
      font-weight: 700; font-size: 20px;
      font-variant-numeric: tabular-nums;
    }
    .resource-card.energy .resource-value { color: var(--color-boost-energy-4-icon); }
    .resource-card.boost  .resource-value { color: var(--color-secondary); }

    .stats-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      padding: 12px 0 4px;
    }
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .stat + .stat { border-left: 1px solid var(--color-border); }
    .stat-value {
      font-weight: 700;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      color: var(--color-text-0);
    }
    [data-theme="dark"] .stat-value { color: var(--color-text-100); }
    .stat-label { font-weight: 400; font-size: 12px; color: var(--color-text-50); margin-top: 2px; }

    .ghost-btn {
      margin-top: 8px;
      padding: 10px 22px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid var(--color-button-border);
      color: var(--color-primary);
      font-weight: 700;
      font-size: 14px;
      transition: background 120ms linear, border-color 120ms linear;
    }
    .ghost-btn:hover {
      background: var(--color-surface2-alt);
      border-color: var(--color-primary);
    }

    /* ---- Section header ---- */
    .section-title {
      margin: 4px 4px 8px;
      font-weight: 600;
      font-size: 16px;
      color: var(--color-text-30-sub-text-dark);
    }
    [data-theme="dark"] .section-title { color: var(--color-text-90); }

    /* ---- Grade Card ---- */
    .grade-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .medal {
      width: 56px; height: 56px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      color: var(--color-white-100);
      background: var(--gradient-grade-gold);
      box-shadow:
        inset 0 -3px 6px rgba(0,0,0,0.2),
        0 4px 10px rgba(0,0,0,0.12);
    }
    .grade-meta { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .grade-label {
      font-weight: 700; font-size: 16px;
      line-height: 1.2;
      text-transform: uppercase;
      color: var(--color-text-0);
    }
    [data-theme="dark"] .grade-label { color: var(--color-text-100); }
    .grade-sub { font-weight: 400; font-size: 12px; line-height: 1.2; color: var(--color-text-50); }
    .grade-score {
      font-weight: 700; font-size: 24px;
      color: var(--color-primary);
      font-variant-numeric: tabular-nums;
    }
    .progress {
      margin-top: 14px;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: var(--color-surface2-alt);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 78%;
      background: var(--gradient-grade-gold);
      border-radius: 999px;
    }
    .progress-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-weight: 400; font-size: 12px;
      color: var(--color-text-50);
    }

    /* ---- Activity tiles ---- */
    .tiles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .tile {
      border-radius: 14px;
      padding: 16px;
      min-height: 96px;
      color: var(--color-white-100);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: filter 120ms linear;
    }
    .tile:hover { filter: brightness(1.08); }
    .tile-label {
      font-weight: 700; font-size: 12px;
      line-height: 1.2;
      text-transform: uppercase;
      opacity: 0.85;
    }
    .tile-value {
      font-weight: 700; font-size: 22px;
      font-variant-numeric: tabular-nums;
    }
    .tile.quiz        { background: var(--gradient-quiz-color); }
    .tile.boosterwall { background: var(--gradient-boosterwall); }
    .tile.boost       { background: var(--gradient-boost-energy-4-bg); }
    .tile.spark       { background: var(--gradient-spark-color); }

    /* ---- Streak ---- */
    .streak-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .streak-title {
      font-weight: 600; font-size: 16px;
      color: var(--color-text-30-sub-text-dark);
    }
    [data-theme="dark"] .streak-title { color: var(--color-text-90); }
    .streak-flame {
      font-weight: 700; font-size: 12px;
      color: var(--color-accent);
    }
    .streak-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .streak-cell {
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700; font-size: 9px;
      background: var(--color-surface2-alt);
      color: var(--color-text-30-sub-text-dark);
    }
    [data-theme="dark"] .streak-cell { color: var(--color-text-90); }
    .streak-cell.done   { background: var(--color-primary); color: var(--color-text-100); }
    .streak-cell.today  {
      background: var(--color-success);
      color: var(--color-text-100);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-success) 25%, transparent);
    }
    .streak-cell.flame  {
      background: var(--gradient-spark-color);
      color: var(--color-text-100);
    }

    /* ---- Menu list ---- */
    .menu-list { display: flex; flex-direction: column; }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 4px;
      border: 0;
      background: transparent;
      text-align: left;
      width: 100%;
      transition: background 120ms linear;
      border-radius: 10px;
    }
    .menu-item:hover { background: var(--color-surface2-alt); }
    .menu-item + .menu-item { border-top: 1px solid var(--color-border); }
    .menu-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .menu-icon.blue   { background: rgba(47, 156, 252, 0.15); color: var(--color-team-color-left, #2f9cfc); color: #2f9cfc; }
    .menu-icon.orange { background: rgba(255, 111, 0, 0.15);  color: var(--color-accent); }
    .menu-icon.purple { background: rgba(111, 76, 255, 0.15); color: var(--color-secondary); }
    .menu-icon.green  { background: rgba(0, 179, 149, 0.15);  color: var(--color-boost-energy-4-icon); }
    .menu-icon.muted  { background: var(--color-surface2-alt); color: var(--color-text-50); }
    .menu-label {
      flex: 1;
      font-weight: 400; font-size: 16px; line-height: 20px;
      color: var(--color-text-30-sub-text-dark);
    }
    [data-theme="dark"] .menu-label { color: var(--color-text-90); }
    .menu-label.muted {
      font-weight: 400; font-size: 14px; line-height: 20px;
      color: var(--color-text-50);
    }
    .chevron { color: var(--color-text-80-sub-text-light); font-size: 16px; }
    .menu-divider {
      height: 1px;
      background: var(--color-border);
      margin: 6px 0;
    }

    /* ---- Bottom tab bar ---- */
    .tabbar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-around;
      padding: 8px 12px env(safe-area-inset-bottom);
      background: var(--color-surface-floating);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--color-border);
      z-index: 20;
    }
    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 4px;
      border: 0;
      background: transparent;
      color: var(--color-text-50);
      font-weight: 400; font-size: 12px; line-height: 1.2;
      transition: color 120ms linear;
    }
    .tab .icon { font-size: 20px; }
    .tab.active { color: var(--color-primary); font-weight: 700; }
    .tab:hover { color: var(--color-primary); }
  </style>
</head>
<body>
  <header class="top-nav">
    <a href="login.html" class="nav-brand" aria-label="RORR 홈">RORR</a>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" aria-label="테마 전환">🌙</button>
      <button class="icon-btn" aria-label="설정">⚙️</button>
    </div>
  </header>

  <main class="page">
    <!-- Profile Hero -->
    <section class="card hero" aria-label="프로필 정보">
      <div class="avatar-ring" aria-hidden="true">
        <div class="avatar">E</div>
      </div>
      <h1 class="nickname text-sub-title">Erin</h1>
      <p class="email text-chat">erin@rorr.club</p>

      <div class="resource-cards">
        <div class="resource-card energy">
          <span class="resource-icon" aria-hidden="true">⚡</span>
          <div class="resource-meta">
            <span class="resource-label">Energy</span>
            <span class="resource-value">320</span>
          </div>
        </div>
        <div class="resource-card boost">
          <span class="resource-icon" aria-hidden="true">🚀</span>
          <div class="resource-meta">
            <span class="resource-label">Boost</span>
            <span class="resource-value">5</span>
          </div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat">
          <span class="stat-value">142</span>
          <span class="stat-label">예측</span>
        </div>
        <div class="stat">
          <span class="stat-value">68%</span>
          <span class="stat-label">적중률</span>
        </div>
        <div class="stat">
          <span class="stat-value">24</span>
          <span class="stat-label">연속</span>
        </div>
      </div>

      <button class="ghost-btn" type="button">프로필 편집</button>
    </section>

    <!-- Grade -->
    <section class="card" aria-label="등급">
      <h2 class="section-title">등급</h2>
      <div class="grade-row">
        <div class="medal" aria-hidden="true">G</div>
        <div class="grade-meta">
          <span class="grade-label">Gold</span>
          <span class="grade-sub">Gold → Platinum</span>
        </div>
        <span class="grade-score">4,680점</span>
      </div>
      <div class="progress" aria-hidden="true">
        <div class="progress-fill"></div>
      </div>
      <div class="progress-labels">
        <span>Gold</span>
        <span>Platinum</span>
      </div>
    </section>

    <!-- Activity -->
    <section aria-label="활동">
      <h2 class="section-title">활동</h2>
      <div class="tiles">
        <div class="tile quiz">
          <span class="tile-label">Quiz</span>
          <span class="tile-value">38</span>
        </div>
        <div class="tile boosterwall">
          <span class="tile-label">Boosterwall</span>
          <span class="tile-value">12</span>
        </div>
        <div class="tile boost">
          <span class="tile-label">Boost Energy</span>
          <span class="tile-value">×5</span>
        </div>
        <div class="tile spark">
          <span class="tile-label">Spark</span>
          <span class="tile-value">97</span>
        </div>
      </div>
    </section>

    <!-- Streak Calendar -->
    <section class="card" aria-label="출석 스트릭">
      <div class="streak-header">
        <span class="streak-title">출석 스트릭</span>
        <span class="streak-flame">🔥 24일 연속</span>
      </div>
      <div class="streak-grid" role="grid" aria-label="이번 주 출석">
        <div class="streak-cell" aria-label="월요일 미출석">월</div>
        <div class="streak-cell" aria-label="화요일 미출석">화</div>
        <div class="streak-cell done" aria-label="수요일 출석">✓</div>
        <div class="streak-cell" aria-label="목요일 미출석">목</div>
        <div class="streak-cell flame" aria-label="금요일 불꽃 출석">🔥</div>
        <div class="streak-cell today" aria-label="토요일 오늘">오늘</div>
        <div class="streak-cell" aria-label="일요일 예정">일</div>
      </div>
    </section>

    <!-- Menu -->
    <section class="card" aria-label="메뉴">
      <div class="menu-list">
        <button class="menu-item" type="button">
          <span class="menu-icon blue" aria-hidden="true">⭐</span>
          <span class="menu-label">Follow Team &amp; Player</span>
          <span class="chevron" aria-hidden="true">›</span>
        </button>
        <button class="menu-item" type="button">
          <span class="menu-icon orange" aria-hidden="true">🛒</span>
          <span class="menu-label">Purchase List</span>
          <span class="chevron" aria-hidden="true">›</span>
        </button>
        <button class="menu-item" type="button">
          <span class="menu-icon purple" aria-hidden="true">🚀</span>
          <span class="menu-label">Boost List</span>
          <span class="chevron" aria-hidden="true">›</span>
        </button>
      </div>

      <div class="menu-divider" role="separator"></div>

      <div class="menu-list">
        <a class="menu-item" href="https://dev-app.rorr.club" target="_blank" rel="noopener">
          <span class="menu-icon green" aria-hidden="true">🔗</span>
          <span class="menu-label muted">dev-app.rorr.club</span>
          <span class="chevron" aria-hidden="true">↗</span>
        </a>
        <a class="menu-item" href="#">
          <span class="menu-icon muted" aria-hidden="true">📄</span>
          <span class="menu-label muted">Terms of Use</span>
          <span class="chevron" aria-hidden="true">›</span>
        </a>
        <a class="menu-item" href="#">
          <span class="menu-icon muted" aria-hidden="true">🔒</span>
          <span class="menu-label muted">Privacy Policy</span>
          <span class="chevron" aria-hidden="true">›</span>
        </a>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="주요 메뉴">
    <button class="tab" type="button">
      <span class="icon" aria-hidden="true">🏠</span>
      <span>홈</span>
    </button>
    <button class="tab" type="button">
      <span class="icon" aria-hidden="true">⚽</span>
      <span>매치</span>
    </button>
    <button class="tab" type="button">
      <span class="icon" aria-hidden="true">🏆</span>
      <span>리그</span>
    </button>
    <button class="tab active" type="button" aria-current="page">
      <span class="icon" aria-hidden="true">👤</span>
      <span>프로필</span>
    </button>
  </nav>

  <script>
    (function () {
      var root = document.documentElement;
      var stored = localStorage.getItem('theme');
      var initial = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      root.dataset.theme = initial;

      var toggle = document.getElementById('themeToggle');
      function syncIcon() {
        toggle.textContent = root.dataset.theme === 'dark' ? '☀️' : '🌙';
      }
      syncIcon();

      toggle.addEventListener('click', function () {
        var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        localStorage.setItem('theme', next);
        syncIcon();
      });
    })();
  </script>
</body>
</html>
