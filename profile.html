<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RORR — 프로필</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
    <link rel="stylesheet" href="./src/tokens.css" />
    <link rel="stylesheet" href="./src/profile/main.css" />
  </head>
  <body>
    <!-- 로딩 오버레이 -->
    <div id="loading-overlay" class="loading-overlay" aria-hidden="true">
      <span class="spinner-ring"></span>
    </div>

    <div class="profile-page">
      <!-- 헤더 -->
      <header class="profile-header">
        <button id="btn-close" class="header-btn" type="button" aria-label="닫기">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="header-title">프로필</span>
        <button id="btn-mail" class="header-btn mail-btn" type="button" aria-label="메일">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M3 7L12 13L21 7" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span id="mail-badge" class="mail-badge hidden" aria-label="미읽은 메시지"></span>
        </button>
      </header>

      <!-- 유저 카드 -->
      <section class="user-card">
        <div id="avatar-wrapper" class="avatar-wrapper grade-participant">
          <img id="avatar-img" class="avatar-img hidden" alt="프로필 이미지" />
          <span id="avatar-fallback" class="avatar-fallback" aria-hidden="true">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
              <circle cx="20" cy="15" r="7" fill="currentColor" opacity="0.7"/>
              <path d="M6 36c0-7.732 6.268-14 14-14s14 6.268 14 14" fill="currentColor" opacity="0.5"/>
            </svg>
          </span>
        </div>

        <div class="user-info">
          <p id="user-email" class="user-email text-annotation"></p>

          <div class="nickname-row">
            <p id="user-nickname" class="user-nickname text-description-2 clamped"></p>
            <button id="nickname-toggle" class="nickname-toggle text-annotation hidden" type="button">더 보기</button>
          </div>

          <div class="user-stats">
            <div class="stat-item spark-stat">
              <span class="stat-label text-annotation">Spark</span>
              <span id="spark-value" class="stat-value spark-value text-description-2">—</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item grade-stat">
              <span class="stat-label text-annotation">등급</span>
              <span id="grade-name" class="stat-value text-description-2">—</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item energy-stat">
              <span class="stat-label text-annotation">에너지</span>
              <div class="energy-row">
                <span id="energy-value" class="stat-value energy-value text-description-2">—</span>
                <button id="btn-charge" class="charge-btn" type="button" aria-label="충전">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                    <path d="M7 2V12M2 7H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 메뉴 리스트 -->
      <nav class="menu-list" aria-label="프로필 메뉴">
        <button class="menu-item" data-type="internal" data-href="follow-league.html?from=profile" type="button">
          <span class="menu-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M10 2C6.13 2 3 5.13 3 9c0 5.25 7 11 7 11s7-5.75 7-11c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 10 6.5a2.5 2.5 0 0 1 0 5z" fill="currentColor"/>
            </svg>
          </span>
          <span class="menu-label text-description-16">팔로우 팀 &amp; 선수</span>
          <span class="menu-arrow internal-arrow" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>

        <button class="menu-item" data-type="internal" data-href="purchase-history.html?from=profile" type="button">
          <span class="menu-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <rect x="3" y="5" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M7 5V4a3 3 0 1 1 6 0v1" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </span>
          <span class="menu-label text-description-16">구매 내역</span>
          <span class="menu-arrow internal-arrow" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>

        <button class="menu-item" data-type="internal" data-href="boost-history.html?from=profile" type="button">
          <span class="menu-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M10 2L12.5 7.5H18L13.5 11L15.5 17L10 13.5L4.5 17L6.5 11L2 7.5H7.5L10 2Z" fill="currentColor" opacity="0.8"/>
            </svg>
          </span>
          <span class="menu-label text-description-16">부스트 내역</span>
          <span class="menu-arrow internal-arrow" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>

        <button class="menu-item" data-type="external" data-href="https://rorr.club" type="button">
          <span class="menu-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
              <path d="M10 2c-2 3-2 13 0 16M2 10h16M3.5 5.5C5.5 7 7.5 8 10 8s4.5-1 6.5-2.5M3.5 14.5C5.5 13 7.5 12 10 12s4.5 1 6.5 2.5" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </span>
          <span class="menu-label text-description-16">서비스 바로가기</span>
          <span class="menu-arrow external-arrow" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M7 3H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V9M9 2h5v5M13 3L8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>

        <button class="menu-item" data-type="external" data-href="https://rorr.club/terms" type="button">
          <span class="menu-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <rect x="4" y="2" width="12" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M7 7h6M7 10h6M7 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="menu-label text-description-16">이용약관</span>
          <span class="menu-arrow external-arrow" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M7 3H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V9M9 2h5v5M13 3L8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>

        <button class="menu-item" data-type="external" data-href="https://rorr.club/privacy" type="button">
          <span class="menu-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M10 2L4 5v5c0 3.87 2.58 7.5 6 9 3.42-1.5 6-5.13 6-9V5L10 2z" stroke="currentColor" stroke-width="1.5"/>
              <path d="M7.5 10l2 2 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="menu-label text-description-16">개인정보 처리방침</span>
          <span class="menu-arrow external-arrow" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M7 3H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V9M9 2h5v5M13 3L8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>
      </nav>
    </div>

    <script type="module" src="./src/profile/main.js"></script>
  </body>
</html>
