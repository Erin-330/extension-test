<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>RORR · 프로필</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" crossorigin />
  <link rel="stylesheet" href="./src/tokens.css" />
  <style>
    html, body {
      width: 100%;
      min-height: 100vh;
    }

    body {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--color-text-50);
      transition: border-color 120ms, background 120ms;
      z-index: 10;
    }
    .theme-toggle:hover { background: var(--color-surface2-alt); border-color: var(--color-primary); }

    .profile-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 20px;
      gap: 16px;
    }

    .profile-card {
      background: var(--color-surface);
      border-radius: 20px;
      box-shadow: var(--shadow-light-surface);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--gradient-boosterwall);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-100);
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .email {
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: var(--color-text-50);
    }

    .stats-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-card {
      background: var(--color-surface);
      border-radius: 16px;
      box-shadow: var(--shadow-light-surface);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stat-label {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-text-50);
    }
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }
    .stat-card.energy .stat-value { color: #00b395; }
    .stat-card.boost  .stat-value { color: var(--color-secondary); }

    .menu-list {
      width: 100%;
      background: var(--color-surface);
      border-radius: 16px;
      box-shadow: var(--shadow-light-surface);
      overflow: hidden;
    }
    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-30);
      cursor: pointer;
      transition: background 120ms;
      border-bottom: 1px solid var(--color-border);
      text-decoration: none;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: var(--color-surface2-alt); }
    .menu-item .chev {
      color: var(--color-text-50);
      font-size: 14px;
    }
    .menu-item .label {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .menu-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-50);
    }

    footer {
      text-align: center;
      padding: 14px 20px;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.2;
      color: var(--color-text-50);
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">
    <span id="themeIcon">☀️</span>
  </button>

  <main class="profile-main">
    <div class="profile-card">
      <div class="avatar">E</div>
      <div class="email">erin@rorr.club</div>
    </div>

    <div class="stats-row">
      <div class="stat-card energy">
        <span class="stat-label">ENERGY</span>
        <span class="stat-value">128</span>
      </div>
      <div class="stat-card boost">
        <span class="stat-label">BOOST</span>
        <span class="stat-value">42</span>
      </div>
    </div>

    <div class="menu-list">
      <a class="menu-item" href="./rank.html">
        <span class="label">
          <span class="menu-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 21h8"/>
              <path d="M12 17v4"/>
              <path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/>
              <path d="M17 5h3v3a3 3 0 0 1-3 3"/>
              <path d="M7 5H4v3a3 3 0 0 0 3 3"/>
            </svg>
          </span>
          <span>Ranking</span>
        </span>
        <span class="chev">›</span>
      </a>
      <a class="menu-item" href="#">
        <span class="label"><span>Follow Team &amp; Player</span></span>
        <span class="chev">›</span>
      </a>
      <a class="menu-item" href="#">
        <span class="label"><span>Purchase List</span></span>
        <span class="chev">›</span>
      </a>
      <a class="menu-item" href="#">
        <span class="label"><span>Boost List</span></span>
        <span class="chev">›</span>
      </a>
      <a class="menu-item" href="https://dev-app.rorr.club" target="_blank" rel="noopener noreferrer">
        <span class="label"><span>dev-app.rorr.club</span></span>
        <span class="chev">↗</span>
      </a>
      <a class="menu-item" href="#">
        <span class="label"><span>Terms of Use</span></span>
        <span class="chev">›</span>
      </a>
      <a class="menu-item" href="#">
        <span class="label"><span>Privacy Policy</span></span>
        <span class="chev">›</span>
      </a>
    </div>
  </main>

  <footer>ⓒPitch Interactive Co.,LTD. All rights reserved</footer>

  <script type="module" src="./src/profile.js"></script>
</body>
</html>
