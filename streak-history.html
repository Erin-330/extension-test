<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RORR — 스트릭 히스토리</title>
  <link rel="stylesheet" href="./src/tokens.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-family-base);
      background-color: var(--color-background-light);
      color: var(--color-text-0);
      transition: background-color 200ms ease, color 200ms ease;
    }
    [data-theme="dark"] body {
      color: var(--color-text-100);
      background-color: var(--color-background-dark);
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header.top {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      align-items: center;
      padding: 14px 16px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }
    [data-theme="dark"] header.top {
      background: var(--color-surface-dark);
      border-bottom-color: var(--color-border-dark);
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-30-sub-text-dark);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 120ms, border-color 120ms;
    }
    [data-theme="dark"] .icon-btn {
      color: var(--color-text-90);
      border-color: var(--color-border-dark);
      background: var(--color-surface-dark);
    }
    .icon-btn:hover { border-color: var(--color-primary); }
    .icon-btn svg { width: 18px; height: 18px; }
    .head-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .head-center .cal-ico {
      width: 18px;
      height: 18px;
      color: var(--color-accent);
    }
    h1.title {
      font-weight: 700;
      font-size: 16px;
      line-height: 1.2;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
    }

    /* Fire Rive section */
    .fire-section {
      background: var(--color-surface);
      border-radius: 16px;
      padding: 12px;
      box-shadow: var(--shadow-light-surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    [data-theme="dark"] .fire-section { background: var(--color-surface-alt-dark); }
    .fire-canvas-wrap {
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fire-canvas-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .streak-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      gap: 8px;
    }
    .streak-stat {
      padding: 10px;
      border-radius: 12px;
      background: var(--color-surface2-alt);
      text-align: center;
    }
    [data-theme="dark"] .streak-stat { background: var(--color-surface-dark); }
    .streak-stat .v {
      font-weight: 700;
      font-size: 20px;
      color: var(--color-text-0);
      font-variant-numeric: tabular-nums;
      background: var(--gradient-spark-color);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .streak-stat .k {
      font-size: 11px;
      color: var(--color-text-50);
      margin-top: 4px;
      letter-spacing: 0.06em;
      font-weight: 700;
    }

    /* Calendar */
    .calendar-card {
      background: var(--color-surface);
      border-radius: 16px;
      padding: 12px;
      box-shadow: var(--shadow-light-surface);
    }
    [data-theme="dark"] .calendar-card { background: var(--color-surface-alt-dark); }
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 12px;
    }
    .cal-nav .month-label {
      font-weight: 700;
      font-size: 15px;
    }
    .cal-nav button {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-30-sub-text-dark);
    }
    [data-theme="dark"] .cal-nav button {
      color: var(--color-text-90);
      border-color: var(--color-border-dark);
    }
    .cal-nav button:hover:not(:disabled) { border-color: var(--color-primary); }
    .cal-nav button:disabled { opacity: 0.4; cursor: not-allowed; }
    .cal-nav button svg { width: 14px; height: 14px; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .dow {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--color-text-50);
      padding: 4px 0;
      letter-spacing: 0.06em;
    }
    .day {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-0);
      transition: background 120ms, border-color 120ms;
      font-family: var(--font-family-base);
    }
    [data-theme="dark"] .day { color: var(--color-text-100); }
    .day:hover { background: var(--color-surface2-alt); }
    [data-theme="dark"] .day:hover { background: var(--color-surface-dark); }
    .day.empty { cursor: default; }
    .day.empty:hover { background: transparent; }
    .day.streak {
      background: var(--gradient-spark-color);
      color: var(--color-text-100);
    }
    .day.active::after {
      content: "";
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--color-secondary);
    }
    .day.streak.active::after { background: var(--color-text-100); }
    .day.today {
      border-color: var(--color-primary);
    }
    .day.selected {
      box-shadow: 0 0 0 2px var(--color-primary);
    }
    .day.future {
      color: var(--color-text-80-sub-text-light);
    }
    [data-theme="dark"] .day.future { color: var(--color-text-50); }

    /* My picks section */
    .picks-section {
      background: var(--color-surface);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-light-surface);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    [data-theme="dark"] .picks-section { background: var(--color-surface-alt-dark); }
    .picks-header {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .picks-header .title {
      font-weight: 700;
      font-size: 16px;
    }
    .picks-header .sub {
      font-size: 12px;
      color: var(--color-text-50);
    }
    .picks-empty {
      border: 1.5px dashed var(--color-border);
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      color: var(--color-text-50);
      font-size: 13px;
    }
    [data-theme="dark"] .picks-empty { border-color: var(--color-border-dark); }

    .pick-card {
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--color-surface);
    }
    [data-theme="dark"] .pick-card {
      background: var(--color-surface-dark);
      border-color: var(--color-border-dark);
    }
    .pick-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--color-text-50);
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .pick-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
    }
    .pick-status.finished { background: var(--color-surface2-alt); color: var(--color-text-30-sub-text-dark); }
    [data-theme="dark"] .pick-status.finished { background: var(--color-surface-alt-dark); color: var(--color-text-90); }
    .pick-status.running { background: var(--color-status-color-live); color: var(--color-text-100); }
    .pick-status.not_started { background: var(--color-status-color-upcoming); color: var(--color-text-100); }

    .pick-teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }
    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px;
      border-radius: 10px;
      border: 1.5px solid transparent;
      background: var(--color-surface2-alt);
    }
    [data-theme="dark"] .team { background: var(--color-surface-alt-dark); }
    .team.selected {
      border-color: var(--color-primary);
      background: var(--color-success-surface);
    }
    [data-theme="dark"] .team.selected {
      background: var(--color-surface-dark);
      border-color: var(--color-primary-dark);
    }
    .team .logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: var(--color-text-100);
    }
    .team.left .logo { background: var(--color-team-color-left); }
    .team.right .logo { background: var(--color-team-color-right); }
    .team .initial {
      font-weight: 700;
      font-size: 13px;
    }
    .team .score {
      font-weight: 700;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
    }
    .vs {
      font-weight: 700;
      font-size: 11px;
      color: var(--color-text-50);
    }

    .pick-result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .result-badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 11px;
      color: var(--color-text-100);
    }
    .result-badge.win { background: var(--color-success); }
    .result-badge.lose { background: var(--color-error); }
    .result-badge.pass { background: var(--color-text-50); }
    .result-badge.pending { background: var(--color-status-color-upcoming); }

    /* Info modal */
    .info-backdrop {
      position: fixed; inset: 0;
      background: var(--color-background-b-30);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .info-backdrop.open { display: flex; }
    .info-modal {
      width: 100%;
      max-width: 360px;
      border-radius: 16px;
      padding: 24px;
      background: var(--color-surface);
    }
    [data-theme="dark"] .info-modal { background: var(--color-surface-dark); }
    .info-modal h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-0);
      margin-bottom: 12px;
    }
    [data-theme="dark"] .info-modal h2 { color: var(--color-text-100); }
    .info-modal ul {
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .info-modal li {
      font-size: 13px;
      line-height: 1.5;
      color: var(--color-text-30-sub-text-dark);
    }
    [data-theme="dark"] .info-modal li { color: var(--color-text-90); }
    .info-modal .close-btn {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: var(--gradient-boosterwall);
      color: var(--color-text-100);
      font-family: var(--font-family-base);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="icon-btn" href="profile.html" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </a>
    <div class="head-center">
      <svg class="cal-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <h1 class="title">스트릭 히스토리</h1>
    </div>
    <button class="icon-btn" id="info-btn" aria-label="퀴즈 규칙 안내">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    </button>
  </header>

  <main>
    <section class="fire-section">
      <div class="fire-canvas-wrap">
        <canvas id="fire-canvas" width="360" height="360"></canvas>
      </div>
      <div class="streak-stats">
        <div class="streak-stat">
          <div class="v" id="current-streak-text">0</div>
          <div class="k">CURRENT</div>
        </div>
        <div class="streak-stat">
          <div class="v" id="longest-streak-text">0</div>
          <div class="k">LONGEST</div>
        </div>
      </div>
    </section>

    <section class="calendar-card">
      <div class="cal-nav">
        <button id="prev-month" aria-label="이전 달">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="month-label" id="month-label">2026년 5월</span>
        <button id="next-month" aria-label="다음 달">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </section>

    <section class="picks-section">
      <div class="picks-header">
        <span class="title" id="picks-title">My Picks</span>
        <span class="sub" id="picks-sub">날짜를 선택하세요</span>
      </div>
      <div id="picks-body"></div>
    </section>
  </main>

  <div class="info-backdrop" id="info-modal">
    <div class="info-modal">
      <h2>퀴즈 규칙</h2>
      <ul>
        <li>퀴즈는 경기당 1회만 등록 가능합니다.</li>
        <li>현재 퀴즈 결과 발표 후 다음 퀴즈에 참여할 수 있습니다.</li>
        <li>스트릭은 매월 UTC 기준으로 초기화됩니다.</li>
      </ul>
      <button class="close-btn" id="info-close">확인</button>
    </div>
  </div>

  <script type="module" src="./src/streak-history.js"></script>
</body>
</html>
